<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* 极简文字层 */
        .layer-text {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: difference;
        }
        
        .logo {
            top: 40px;
            left: 40px;
            font-size: 14px;
            letter-spacing: 8px;
            opacity: 0.6;
        }
        
        .nav {
            top: 40px;
            right: 40px;
            text-align: right;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.4;
        }
        
        .nav div {
            margin-bottom: 8px;
            transition: opacity 0.3s;
        }
        
        .nav div:hover {
            opacity: 1;
            cursor: pointer;
        }
        
        /* 当前状态指示 */
        .indicator {
            position: fixed;
            bottom: 40px;
            left: 40px;
            font-size: 10px;
            letter-spacing: 4px;
            opacity: 0.5;
            z-index: 10;
        }
        
        .indicator-bar {
            width: 60px;
            height: 1px;
            background: rgba(255,255,255,0.3);
            margin-top: 10px;
            position: relative;
        }
        
        .indicator-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #fff;
            transition: width 0.5s;
        }
        
        /* 交互提示 */
        .hint {
            position: fixed;
            bottom: 40px;
            right: 40px;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.3;
            z-index: 10;
        }
        
        /* 声音波纹 */
        .sound-ring {
            position: absolute;
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        
        /* 全屏覆盖 */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
        }
        
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .start-btn {
            padding: 20px 40px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: #fff;
            font-size: 12px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .start-btn:hover {
            border-color: #8b5cf6;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>
    <!-- 启动覆盖层 -->
    <div id="overlay">
        <button class="start-btn" onclick="startExperience()">INITIALIZE</button>
    </div>
    
    <!-- Three.js 画布 -->
    <div id="canvas-container"></div>
    
    <!-- 极简 UI -->
    <div class="layer-text logo">ECHO // PROTOCOL</div>
    
    <div class="layer-text nav">
        <div data-scene="0">◉ ORIGIN</div>
        <div data-scene="1">◈ SEPARATION</div>
        <div data-scene="2">◆ LINEAGE</div>
        <div data-scene="3">◊ FLOW</div>
    </div>
    
    <div class="layer-text indicator">
        <div id="scene-name">ORIGIN</div>
        <div class="indicator-bar">
            <div class="indicator-progress" id="progress"></div>
        </div>
    </div>
    
    <div class="layer-text hint">SCROLL / DRAG / CLICK</div>

    <script>
        // ==================== Three.js 核心场景 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        
        // 全局状态
        let currentScene = 0;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let scrollProgress = 0;
        let time = 0;
        
        // 场景对象存储
        const sceneObjects = {
            origin: [],
            separation: [],
            lineage: [],
            flow: []
        };
        
        // ==================== 场景 0: ORIGIN - 声波诞生 ====================
        function createOriginScene() {
            const group = new THREE.Group();
            
            // 中心核心 - 脉冲球体
            const coreGeometry = new THREE.IcosahedronGeometry(3, 4);
            const coreMaterial = new THREE.MeshBasicMaterial({
                color: 0x8b5cf6,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            group.add(core);
            
            // 内层波纹
            for(let i = 0; i < 5; i++) {
                const ringGeometry = new THREE.TorusGeometry(5 + i * 2, 0.02, 16, 100);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(0.75, 0.8, 0.5),
                    transparent: true,
                    opacity: 0.3 - i * 0.05
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                ring.userData = { 
                    baseScale: 1, 
                    phase: i * 0.5,
                    speed: 0.5 + i * 0.1
                };
                group.add(ring);
                sceneObjects.origin.push(ring);
            }
            
            // 外层粒子 - 声音碎片
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 2000;
            const posArray = new Float32Array(particlesCount * 3);
            const scaleArray = new Float32Array(particlesCount);
            
            for(let i = 0; i < particlesCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 15 + Math.random() * 30;
                
                posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                posArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                posArray[i * 3 + 2] = r * Math.cos(phi);
                scaleArray[i] = Math.random();
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particlesGeometry.setAttribute('scale', new THREE.BufferAttribute(scaleArray, 1));
            
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.1,
                color: 0xc084fc,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            group.add(particles);
            sceneObjects.origin.push(particles);
            
            sceneObjects.origin.push(core);
            return group;
        }
        
        // ==================== 场景 1: SEPARATION - 四维分离 ====================
        function createSeparationScene() {
            const group = new THREE.Group();
            
            // 四个维度 - 四面体的四个顶点
            const dimensions = [
                { name: 'OWNERSHIP', color: 0x8b5cf6, pos: [0, 8, 0] },
                { name: 'USAGE', color: 0xd946ef, pos: [7.5, -2.5, 4.3] },
                { name: 'DERIVATIVE', color: 0x06b6d4, pos: [-7.5, -2.5, 4.3] },
                { name: 'EXTENSION', color: 0xf59e0b, pos: [0, -2.5, -8.6] }
            ];
            
            dimensions.forEach((dim, i) => {
                // 维度核心
                const geometry = new THREE.OctahedronGeometry(1.5, 0);
                const material = new THREE.MeshBasicMaterial({
                    color: dim.color,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.8
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(...dim.pos);
                mesh.userData = { originalPos: [...dim.pos], index: i };
                group.add(mesh);
                
                // 连接线到中心
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(...dim.pos),
                    new THREE.Vector3(0, 0, 0)
                ]);
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: dim.color,
                    transparent: true,
                    opacity: 0.3
                });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                group.add(line);
                
                // 轨道环
                const orbitGeometry = new THREE.TorusGeometry(2, 0.03, 16, 100);
                const orbitMaterial = new THREE.MeshBasicMaterial({
                    color: dim.color,
                    transparent: true,
                    opacity: 0.4
                });
                const orbit = new THREE.Mesh(orbitGeometry, orbitMaterial);
                orbit.position.set(...dim.pos);
                orbit.lookAt(0, 0, 0);
                orbit.userData = { rotationSpeed: 0.5 + i * 0.2 };
                group.add(orbit);
                
                sceneObjects.separation.push(mesh, orbit);
            });
            
            // 中心能量球
            const centerGeometry = new THREE.SphereGeometry(1, 32, 32);
            const centerMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9
            });
            const center = new THREE.Mesh(centerGeometry, centerMaterial);
            group.add(center);
            sceneObjects.separation.push(center);
            
            return group;
        }
        
        // ==================== 场景 2: LINEAGE - 创作血缘 ====================
        function createLineageScene() {
            const group = new THREE.Group();
            
            // 创建树状结构的节点
            const nodes = [
                { pos: [0, 10, 0], size: 2, color: 0xf59e0b }, // 根
                { pos: [-8, 3, 3], size: 1.5, color: 0x8b5cf6 },
                { pos: [8, 3, -2], size: 1.5, color: 0x8b5cf6 },
                { pos: [0, 3, 6], size: 1.5, color: 0x8b5cf6 },
                { pos: [-12, -5, 5], size: 1, color: 0x06b6d4 },
                { pos: [-4, -5, 2], size: 1, color: 0x06b6d4 },
                { pos: [12, -5, -3], size: 1, color: 0x06b6d4 },
                { pos: [4, -5, 8], size: 1, color: 0x06b6d4 }
            ];
            
            nodes.forEach((node, i) => {
                // 节点球体
                const geometry = new THREE.SphereGeometry(node.size, 32, 32);
                const material = new THREE.MeshBasicMaterial({
                    color: node.color,
                    transparent: true,
                    opacity: 0.8
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(...node.pos);
                mesh.userData = { 
                    originalPos: [...node.pos],
                    pulsePhase: i * 0.5,
                    isNode: true,
                    id: i
                };
                group.add(mesh);
                sceneObjects.lineage.push(mesh);
                
                // 脉冲环
                const ringGeo = new THREE.RingGeometry(node.size * 1.5, node.size * 1.6, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: node.color,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(...node.pos);
                ring.lookAt(0, 0, 0);
                ring.userData = { parentNode: mesh };
                group.add(ring);
                sceneObjects.lineage.push(ring);
            });
            
            // 连接线
            const connections = [
                [0, 1], [0, 2], [0, 3],
                [1, 4], [1, 5],
                [2, 6], [3, 7]
            ];
            
            connections.forEach(([a, b]) => {
                const points = [
                    new THREE.Vector3(...nodes[a].pos),
                    new THREE.Vector3(...nodes[b].pos)
                ];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({
                    color: 0x8b5cf6,
                    transparent: true,
                    opacity: 0.2
                });
                const line = new THREE.Line(geometry, material);
                group.add(line);
                
                // 流动粒子
                const particleGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const particle = new THREE.Mesh(particleGeo, particleMat);
                particle.userData = { 
                    start: new THREE.Vector3(...nodes[a].pos),
                    end: new THREE.Vector3(...nodes[b].pos),
                    progress: Math.random(),
                    speed: 0.005 + Math.random() * 0.01
                };
                group.add(particle);
                sceneObjects.lineage.push(particle);
            });
            
            return group;
        }
        
        // ==================== 场景 3: FLOW - 价值流动 ====================
        function createFlowScene() {
            const group = new THREE.Group();
            
            // 创建瀑布效果
            const streamCount = 5;
            const streams = [];
            
            for(let i = 0; i < streamCount; i++) {
                const streamGroup = new THREE.Group();
                
                // 主流动线
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3((i - 2) * 4, 15, 0),
                    new THREE.Vector3((i - 2) * 3, 5, 2),
                    new THREE.Vector3((i - 2) * 2, -5, -2),
                    new THREE.Vector3((i - 2) * 1, -15, 0)
                ]);
                
                const points = curve.getPoints(50);
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({
                    color: i === 0 ? 0xf59e0b : i === 1 ? 0x8b5cf6 : 0x06b6d4,
                    transparent: true,
                    opacity: 0.3
                });
                const line = new THREE.Line(geometry, material);
                streamGroup.add(line);
                
                // 流动粒子
                const particleCount = 20;
                for(let j = 0; j < particleCount; j++) {
                    const pGeo = new THREE.SphereGeometry(0.15, 8, 8);
                    const pMat = new THREE.MeshBasicMaterial({
                        color: i === 0 ? 0xf59e0b : i === 1 ? 0x8b5cf6 : 0x06b6d4,
                        transparent: true,
                        opacity: 0.8
                    });
                    const particle = new THREE.Mesh(pGeo, pMat);
                    particle.userData = {
                        curve: curve,
                        progress: j / particleCount,
                        speed: 0.002 + Math.random() * 0.003
                    };
                    streamGroup.add(particle);
                    sceneObjects.flow.push(particle);
                }
                
                streams.push(streamGroup);
                group.add(streamGroup);
            }
            
            // 汇聚池
            const poolGeometry = new THREE.CylinderGeometry(8, 10, 2, 32);
            const poolMaterial = new THREE.MeshBasicMaterial({
                color: 0x8b5cf6,
                transparent: true,
                opacity: 0.1,
                wireframe: true
            });
            const pool = new THREE.Mesh(poolGeometry, poolMaterial);
            pool.position.y = -18;
            group.add(pool);
            sceneObjects.flow.push(pool);
            
            return group;
        }
        
        // 初始化所有场景
        const originGroup = createOriginScene();
        const separationGroup = createSeparationScene();
        const lineageGroup = createLineageScene();
        const flowGroup = createFlowScene();
        
        // 初始只显示第一个
        scene.add(originGroup);
        separationGroup.visible = false;
        lineageGroup.visible = false;
        flowGroup.visible = false;
        scene.add(separationGroup);
        scene.add(lineageGroup);
        scene.add(flowGroup);
        
        const sceneGroups = [originGroup, separationGroup, lineageGroup, flowGroup];
        const sceneNames = ['ORIGIN', 'SEPARATION', 'LINEAGE', 'FLOW'];
        
        // ==================== 交互控制 ====================
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });
        
        document.addEventListener('wheel', (e) => {
            scrollProgress += e.deltaY * 0.001;
            scrollProgress = Math.max(0, Math.min(3, scrollProgress));
            
            const newScene = Math.floor(scrollProgress);
            if(newScene !== currentScene && newScene < 4) {
                switchScene(newScene);
            }
            
            document.getElementById('progress').style.width = (scrollProgress % 1 * 100) + '%';
        });
        
        // 导航点击
        document.querySelectorAll('.nav div').forEach((el, i) => {
            el.addEventListener('click', () => {
                scrollProgress = i;
                switchScene(i);
            });
        });
        
        function switchScene(index) {
            currentScene = index;
            
            sceneGroups.forEach((g, i) => {
                g.visible = i === index;
            });
            
            document.getElementById('scene-name').textContent = sceneNames[index];
            document.getElementById('progress').style.width = '0%';
        }
        
        function startExperience() {
            document.getElementById('overlay').classList.add('hidden');
        }
        
        // ==================== 动画循环 ====================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;
            
            // 场景 0: ORIGIN - 波纹扩散
            if(currentScene === 0) {
                sceneObjects.origin.forEach((obj, i) => {
                    if(obj.userData.phase !== undefined) {
                        const scale = 1 + Math.sin(time * obj.userData.speed + obj.userData.phase) * 0.3;
                        obj.scale.set(scale, scale, scale);
                        obj.material.opacity = (0.3 - i * 0.05) * (1 - (scale - 1) * 2);
                    }
                    if(obj.type === 'Points') {
                        obj.rotation.y = time * 0.1;
                    }
                });
                originGroup.rotation.x = targetY * 0.2;
                originGroup.rotation.y = targetX * 0.2 + time * 0.1;
            }
            
            // 场景 1: SEPARATION - 轨道旋转
            if(currentScene === 1) {
                sceneObjects.separation.forEach(obj => {
                    if(obj.userData.rotationSpeed) {
                        obj.rotation.z += obj.userData.rotationSpeed * 0.01;
                    }
                    if(obj.userData.index !== undefined) {
                        const float = Math.sin(time + obj.userData.index) * 0.5;
                        obj.position.y = obj.userData.originalPos[1] + float;
                    }
                });
                separationGroup.rotation.y = targetX * 0.3;
                separationGroup.rotation.x = targetY * 0.2;
            }
            
            // 场景 2: LINEAGE - 脉冲与流动
            if(currentScene === 2) {
                sceneObjects.lineage.forEach(obj => {
                    if(obj.userData.isNode) {
                        const pulse = 1 + Math.sin(time * 2 + obj.userData.pulsePhase) * 0.1;
                        obj.scale.set(pulse, pulse, pulse);
                    }
                    if(obj.userData.parentNode) {
                        obj.scale.setScalar(1 + Math.sin(time * 3) * 0.2);
                    }
                    if(obj.userData.curve) {
                        obj.userData.progress += obj.userData.speed;
                        if(obj.userData.progress > 1) obj.userData.progress = 0;
                        const pos = obj.userData.curve.getPoint(obj.userData.progress);
                        obj.position.copy(pos);
                    }
                });
                lineageGroup.rotation.y = time * 0.05 + targetX * 0.2;
            }
            
            // 场景 3: FLOW - 瀑布流动
            if(currentScene === 3) {
                sceneObjects.flow.forEach(obj => {
                    if(obj.userData.curve) {
                        obj.userData.progress += obj.userData.speed;
                        if(obj.userData.progress > 1) obj.userData.progress = 0;
                        const pos = obj.userData.curve.getPoint(obj.userData.progress);
                        obj.position.copy(pos);
                        
                        // 尾迹效果
                        obj.scale.setScalar(1 - obj.userData.progress * 0.5);
                    }
                });
                flowGroup.rotation.y = targetX * 0.1;
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
