<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ECHO Test</title>
<style>
:root { --ink-black: #0c0c0e; --ink-rice: #f0f0e8; }
body { margin:0; padding:0; background:var(--ink-black); color:var(--ink-rice); font-family:sans-serif; width:100vw; height:100vh; display:flex; }
nav { width:200px; background:#1a1a1e; padding:20px; }
main { flex:1; height:100vh; overflow:hidden; }
.page { display:none; width:100%; height:100%; padding:40px; overflow-y:auto; }
.page.active { display:block; }
nav a { display:block; padding:10px; color:#8a8a90; text-decoration:none; cursor:pointer; }
nav a.active { color:#4a90a4; border-left:2px solid #4a90a4; }
</style>
</head>
<body>
<nav>
  <h2 style="color:#f0f0e8;">ECHO</h2>
  <a class="active" onclick="show('home')">首页</a>
  <a onclick="show('rights')">四权</a>
</nav>
<main>
  <div class="page active" id="home">
    <h1>水墨粒子首页</h1>
    <p>如果你能看到这段文字，说明基本框架正常。</p>
    <canvas id="test-canvas" width="400" height="200" style="border:1px solid #4a90a4;"></canvas>
  </div>
  <div class="page" id="rights">
    <h1>四权配置</h1>
    <p>这是四权页面内容。</p>
    <div style="width:100px;height:100px;background:#c45c48;border-radius:50%;"></div>
  </div>
</main>
<script>
function show(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
}
// 绘制测试canvas
const c = document.getElementById('test-canvas');
const ctx = c.getContext('2d');
ctx.fillStyle = '#4a90a4';
ctx.fillRect(50,50,100,80);
ctx.fillStyle = '#f0f0e8';
ctx.font = '20px sans-serif';
ctx.fillText('Canvas OK', 170, 100);
</script>
</body>
</html>
