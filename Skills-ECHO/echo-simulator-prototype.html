<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHO 模拟器 — 交互原型 v1.0</title>
  <style>
    :root {
      --bg-paper: #F5F0E6;
      --bg-paper-dark: #E8E0D0;
      --accent-teal: #5AA4AE;
      --accent-teal-light: #7EC5CE;
      --accent-teal-dark: #3D8A94;
      --alert-red: #C85A54;
      --alert-red-light: #E07A74;
      --ink: #2D3436;
      --ink-light: #5A6366;
      --ink-muted: #8A9295;
      --border: #D5CFC4;
      --border-light: #E5DFD4;
      --panel-bg: #FAF7F0;
      --card-bg: #FFFFFF;
      --shadow: 0 2px 8px rgba(45,52,54,0.06);
      --shadow-hover: 0 4px 16px rgba(45,52,54,0.10);
      --radius: 8px;
      --radius-sm: 4px;
      --header-h: 56px;
      --sidebar-w: 240px;
      --rightpanel-w: 300px;
      --statusbar-h: 32px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-paper);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ===== 顶部全局栏 ===== */
    .global-header {
      height: var(--header-h);
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      position: relative;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent-teal-dark);
      cursor: pointer;
    }

    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent-teal);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: 800;
    }

    .mainline-progress {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }

    .progress-step .dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }

    .progress-step.active {
      background: rgba(90,164,174,0.12);
      color: var(--accent-teal-dark);
    }

    .progress-step.active .dot {
      background: var(--accent-teal);
      color: white;
    }

    .progress-step.done {
      color: var(--accent-teal);
    }

    .progress-step.done .dot {
      background: var(--accent-teal);
      color: white;
    }

    .progress-step.pending {
      color: var(--ink-muted);
    }

    .progress-step.pending .dot {
      background: var(--border);
      color: var(--ink-muted);
    }

    .progress-arrow {
      color: var(--ink-muted);
      font-size: 11px;
    }

    .global-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tool-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      color: var(--ink-light);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      border-color: var(--accent-teal);
      color: var(--accent-teal-dark);
    }

    .tool-btn.primary {
      background: var(--accent-teal);
      color: white;
      border-color: var(--accent-teal);
    }

    .tool-btn.primary:hover {
      background: var(--accent-teal-dark);
    }

    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent-teal-light);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }

    /* ===== 主体布局 ===== */
    .main-container {
      display: flex;
      height: calc(100vh - var(--header-h) - var(--statusbar-h));
    }

    .left-sidebar {
      width: var(--sidebar-w);
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }

    .center-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .right-panel {
      width: var(--rightpanel-w);
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }

    /* ===== 底部状态栏 ===== */
    .status-bar {
      height: var(--statusbar-h);
      background: var(--ink);
      color: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 24px;
      font-size: 11px;
    }

    .status-bar span { display: flex; align-items: center; gap: 6px; }
    .status-bar .live-dot {
      width: 6px; height: 6px;
      background: #4CD964;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== 模块容器 ===== */
    .module { display: none; }
    .module.active { display: block; }

    /* ===== 通用组件 ===== */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent-teal);
      color: white;
    }

    .btn-primary:hover { background: var(--accent-teal-dark); }

    .btn-secondary {
      background: var(--bg-paper-dark);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border-light); }

    .btn-danger {
      background: var(--alert-red);
      color: white;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 500;
    }

    .tag-teal { background: rgba(90,164,174,0.12); color: var(--accent-teal-dark); }
    .tag-red { background: rgba(200,90,84,0.12); color: var(--alert-red); }
    .tag-gray { background: var(--bg-paper-dark); color: var(--ink-muted); }

    /* ===== 规则配置面板 ===== */
    .config-step-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
    }

    .config-step-item:hover { background: var(--bg-paper-dark); }

    .config-step-item.active {
      background: rgba(90,164,174,0.08);
      border-left: 3px solid var(--accent-teal);
    }

    .config-step-item .step-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .config-step-item.active .step-num {
      background: var(--accent-teal);
      color: white;
    }

    .config-step-item.done .step-num {
      background: var(--accent-teal);
      color: white;
    }

    .config-step-item .step-label {
      font-size: 12px;
    }

    .config-step-item.active .step-label {
      font-weight: 600;
      color: var(--accent-teal-dark);
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .template-card {
      background: var(--card-bg);
      border: 2px solid var(--border-light);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .template-card:hover {
      border-color: var(--accent-teal);
      box-shadow: var(--shadow-hover);
    }

    .template-card.selected {
      border-color: var(--accent-teal);
      background: rgba(90,164,174,0.04);
    }

    .template-card .template-icon {
      width: 40px; height: 40px;
      background: var(--bg-paper-dark);
      border-radius: 10px;
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .template-card.selected .template-icon {
      background: rgba(90,164,174,0.15);
    }

    .template-card .template-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .template-card .template-desc {
      font-size: 11px;
      color: var(--ink-muted);
    }

    .param-form .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .param-form .form-group {
      flex: 1;
    }

    .param-form label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-light);
      margin-bottom: 4px;
    }

    .param-form input, .param-form select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 12px;
      color: var(--ink);
    }

    .param-form input:focus, .param-form select:focus {
      outline: none;
      border-color: var(--accent-teal);
    }

    /* Agent 画布模拟 */
    .agent-canvas {
      width: 100%;
      height: 400px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    .agent-node {
      position: absolute;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 2;
    }

    .agent-node:hover { transform: scale(1.15); z-index: 10; }

    .agent-node.creator { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); background: var(--accent-teal); }
    .agent-node.consumer { border-radius: 50%; background: #6BCB77; }
    .agent-node.intermediary { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); background: #FFA94D; }
    .agent-node.governance { border-radius: 4px; background: var(--ink-light); }

    .agent-edge {
      position: absolute;
      height: 1px;
      background: var(--border);
      transform-origin: left center;
      z-index: 1;
    }

    .agent-edge.trust { height: 2px; background: var(--accent-teal); opacity: 0.4; }

    .canvas-legend {
      position: absolute;
      bottom: 10px; right: 10px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 10px;
    }

    .canvas-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .canvas-legend-item:last-child { margin-bottom: 0; }

    .legend-shape {
      width: 10px; height: 10px;
    }

    /* ===== 推演播放器 ===== */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }

    .player-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }

    .player-btn:hover { background: var(--bg-paper-dark); }

    .player-btn.play {
      background: var(--accent-teal);
      color: white;
      border-color: var(--accent-teal);
    }

    .player-btn.play:hover { background: var(--accent-teal-dark); }

    .time-slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent-teal);
      cursor: pointer;
    }

    .time-display {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }

    .speed-selector {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 11px;
      cursor: pointer;
    }

    .view-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .view-tab {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .view-tab:hover { border-color: var(--accent-teal); }

    .view-tab.active {
      background: var(--accent-teal);
      color: white;
      border-color: var(--accent-teal);
    }

    .sim-canvas {
      width: 100%;
      height: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    /* 宏观网络 */
    .network-view .sim-node {
      position: absolute;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .sim-node.type-creator { background: var(--accent-teal); }
    .sim-node.type-consumer { background: #6BCB77; }
    .sim-node.type-intermediary { background: #FFA94D; }
    .sim-node.type-governance { background: var(--ink-light); }

    .sim-node.high-potential {
      box-shadow: 0 0 12px rgba(90,164,174,0.5), 0 2px 6px rgba(0,0,0,0.15);
    }

    .sim-edge {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, var(--border), var(--accent-teal-light));
      transform-origin: left center;
      opacity: 0.5;
      z-index: 0;
    }

    /* 中观领域 */
    .domain-chart {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 30px;
      height: 100%;
      padding: 40px;
    }

    .domain-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .domain-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .domain-bar {
      width: 18px;
      border-radius: 3px 3px 0 0;
      transition: all 0.3s;
      cursor: pointer;
    }

    .domain-bar:hover { opacity: 0.8; }

    .domain-bar.creators { background: var(--accent-teal); }
    .domain-bar.consumers { background: #6BCB77; }
    .domain-bar.volume { background: var(--accent-teal-light); }

    .domain-label {
      font-size: 11px;
      color: var(--ink-light);
      text-align: center;
    }

    .domain-rho {
      font-size: 10px;
      color: var(--accent-teal);
      font-weight: 600;
    }

    /* 微观个体 */
    .micro-view {
      padding: 20px;
    }

    .micro-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .micro-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent-teal);
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    .micro-info h3 {
      font-size: 15px;
      margin-bottom: 2px;
    }

    .micro-info .meta {
      font-size: 11px;
      color: var(--ink-muted);
    }

    .micro-stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
    }

    .micro-stat {
      text-align: center;
    }

    .micro-stat .value {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-teal-dark);
    }

    .micro-stat .label {
      font-size: 10px;
      color: var(--ink-muted);
    }

    .micro-tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .micro-tab {
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .micro-tab:hover { color: var(--accent-teal-dark); }

    .micro-tab.active {
      color: var(--accent-teal-dark);
      border-bottom-color: var(--accent-teal);
      font-weight: 600;
    }

    .decision-log {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .decision-item {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-paper);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent-teal);
    }

    .decision-item .ts {
      font-size: 10px;
      color: var(--ink-muted);
      white-space: nowrap;
      width: 40px;
    }

    .decision-item .content {
      flex: 1;
    }

    .decision-item .type {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-teal-dark);
      margin-bottom: 2px;
    }

    .decision-item .reason {
      font-size: 11px;
      color: var(--ink-light);
    }

    /* ===== 仪表盘 ===== */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
    }

    .metric-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }

    .metric-card .metric-label {
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .metric-card .metric-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .metric-card .metric-delta {
      font-size: 11px;
      font-weight: 500;
    }

    .metric-card .metric-delta.up { color: #6BCB77; }
    .metric-card .metric-delta.down { color: var(--alert-red); }

    .metric-card.health-good { border-top: 3px solid #6BCB77; }
    .metric-card.health-warn { border-top: 3px solid #FFA94D; }
    .metric-card.health-danger { border-top: 3px solid var(--alert-red); }

    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 16px;
      height: 280px;
      position: relative;
    }

    .chart-placeholder {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 10px;
      gap: 4px;
    }

    .chart-bar {
      flex: 1;
      background: var(--accent-teal);
      border-radius: 3px 3px 0 0;
      opacity: 0.7;
      transition: opacity 0.2s;
      min-height: 10px;
    }

    .chart-bar:hover { opacity: 1; }

    .chart-line {
      position: absolute;
      top: 40px;
      left: 50px;
      right: 30px;
      height: 2px;
      background: var(--alert-red);
      opacity: 0.5;
    }

    /* ===== 资源浏览器 ===== */
    .browser-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-box {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 12px;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .filter-tag {

    .skill-grid {
      display: grid;

    .skill-card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);

      cursor: pointer;

      display: flex;
      flex-wrap: wrap;

    .alignment-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

      background: var(--accent-teal);
      border-radius: 4px;

    /* ===== 事件列表 ===== */

      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .event-item:hover { background: var(--bg-paper-dark); }

    .event-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .event-dot.downgrade { background: var(--alert-red); }
    .event-dot.fork { background: #FFA94D; }
    .event-dot.newnode { background: #6BCB77; }
    .event-dot.governance { background: var(--accent-teal); }

    .event-ts { color: var(--ink-muted); width: 32px; }
    .event-desc { flex: 1; }

    /* ===== 右侧属性面板通用 ===== */
    .panel-section {
      margin-bottom: 16px;
    }

    .panel-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .kv-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
    }

    .kv-row:last-child { border-bottom: none; }

    .kv-key { color: var(--ink-light); }
    .kv-val { font-weight: 500; }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

    /* ===== 响应式 ===== */
    @media (max-width: 1200px) {
      .right-panel { display: none; }
    }

    /* ===== 空状态 ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: var(--ink-muted);
      text-align: center;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    /* 动画 */
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* 脉冲效果 */
    .pulse-red {
      animation: pulseRed 1s ease;
    }

    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(200,90,84,0.6); }
      70% { box-shadow: 0 0 0 20px rgba(200,90,84,0); }
      100% { box-shadow: 0 0 0 0 rgba(200,90,84,0); }

    .pulse-orange {
      animation: pulseOrange 1s ease;
    }

    @keyframes pulseOrange {
      0% { box-shadow: 0 0 0 0 rgba(255,169,77,0.6); }
      70% { box-shadow: 0 0 0 20px rgba(255,169,77,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,169,77,0); }

  </style>
</head>
<body>

<!-- ===== 顶部全局栏 ===== -->
<header class="global-header">
  <div class="logo" onclick="switchModule('config')">

      <span class="dot">2</span>
      <span>推演播放器</span>
    </div>
    <span class="progress-arrow">→</span>
    <div class="progress-step pending" id="step-dash" onclick="if(document.getElementById('step-dash').classList.contains('done')||document.getElementById('step-dash').classList.contains('active')) switchModule('dashboard')">
      <span class="dot">3</span>
      <span>仪表盘</span>
    </div>
  </div>

  <div class="global-tools">
    <button class="tool-btn" onclick="toggleBrowser('resource')">📦 资源浏览器</button>
    <button class="tool-btn" onclick="toggleBrowser('user')">👤 用户浏览器</button>
    <div class="user-avatar">C</div>
  </div>
</header>

<!-- ===== 主体 ===== -->
<div class="main-container">

  <!-- 左侧边栏 -->
  <aside class="left-sidebar" id="leftSidebar">
    <!-- 动态内容 -->
  </aside>

  <!-- 中央画布 -->
  <main class="center-canvas" id="centerCanvas">
    <!-- 动态内容 -->
  </main>

  <!-- 右侧属性面板 -->
  <aside class="right-panel" id="rightPanel">
    <!-- 动态内容 -->
  </aside>

</div>

<!-- ===== 底部状态栏 ===== -->
<div class="status-bar">
  <span><span class="live-dot"></span> 模拟器就绪</span>
  <span>当前步: <strong id="statusStep">—</strong></span>
  <span>活跃Agent: <strong id="statusAgents">—</strong></span>
  <span>待处理交易: <strong id="statusTx">—</strong></span>
  <span style="margin-left:auto">网络延迟: 12ms</span>
</div>

<script>
// ==================== 全局状态 ====================
let currentModule = 'config';
let currentConfigStep = 1;
let simulationRunning = false;
let currentTimeStep = 0;
let totalTimeSteps = 200;
let playbackSpeed = 1;
let simInterval = null;
let currentSimView = 'macro';
let currentMicroTab = 'decision';

// ==================== 模块切换 ====================
function switchModule(module) {
  currentModule = module;

  // 更新进度条
  document.querySelectorAll('.progress-step').forEach(el => {
    el.classList.remove('active', 'done', 'pending');
  });

  if (module === 'config') {
    document.getElementById('step-config').classList.add('active');
    document.getElementById('step-sim').classList.add('pending');
    document.getElementById('step-dash').classList.add('pending');
  } else if (module === 'simulation') {
    document.getElementById('step-config').classList.add('done');
    document.getElementById('step-sim').classList.add('active');
    document.getElementById('step-dash').classList.add('pending');
  } else if (module === 'dashboard') {
    document.getElementById('step-config').classList.add('done');
    document.getElementById('step-sim').classList.add('done');
    document.getElementById('step-dash').classList.add('active');
  }

  renderModule();
}

function renderModule() {
  if (currentModule === 'config') renderConfig();
  else if (currentModule === 'simulation') renderSimulation();
  else if (currentModule === 'dashboard') renderDashboard();
  else if (currentModule === 'resource') renderResourceBrowser();
  else if (currentModule === 'resourceDetail') renderResourceDetail();
  else if (currentModule === 'user') renderUserBrowser();
  else if (currentModule === 'userDetail') renderUserDetail();
}

// ==================== 规则配置面板 ====================

function generateAgentCanvas() {
  const agents = [
    {x:120,y:80,t:'creator',n:'A1'},{x:280,y:60,t:'creator',n:'A2'},{x:200,y:160,t:'consumer',n:'B1'},
    {x:350,y:140,t:'consumer',n:'B2'},{x:100,y:200,t:'intermediary',n:'C1'},{x:300,y:220,t:'intermediary',n:'C2'},
    {x:180,y:280,t:'governance',n:'D1'},{x:400,y:260,t:'creator',n:'A3'},{x:50,y:120,t:'consumer',n:'B3'},
    {x:420,y:100,t:'intermediary',n:'C3'}
  ];
  let html = '';
  agents.forEach((a,i) => {
    html += `<div class="agent-node ${a.t}" style="left:${a.x}px;top:${a.y}px">${a.n}</div>`;
  });
  // 添加一些连线
  const edges = [[0,2],[0,4],[1,2],[1,3],[2,6],[3,5],[4,6],[5,7],[7,9],[8,4],[3,9]];
  edges.forEach(([f,t]) => {
    const a1 = agents[f], a2 = agents[t];
    const dx = a2.x - a1.x, dy = a2.y - a1.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    html += `<div class="agent-edge ${Math.random()>0.7?'trust':''}" style="left:${a1.x+18}px;top:${a1.y+18}px;width:${len}px;transform:rotate(${angle}deg)"></div>`;
  });
  return html;
}

function addRandomAgent() {
  const canvas = document.getElementById('agentCanvas');
  const types = ['creator','consumer','intermediary','governance'];
  const t = types[Math.floor(Math.random()*types.length)];
  const x = 50 + Math.random() * 350;
  const y = 50 + Math.random() * 300;
  const n = String.fromCharCode(65+Math.floor(Math.random()*4)) + (Math.floor(Math.random()*9)+1);
  const node = document.createElement('div');
  node.className = `agent-node ${t}`;
  node.style.left = x + 'px';
  node.style.top = y + 'px';
  node.textContent = n;
  canvas.appendChild(node);
}

  const btn = document.getElementById('playBtn');
  if (simulationRunning) {
    simulationRunning = false;
    btn.innerHTML = '▶';
    clearInterval(simInterval);
  } else {
    simulationRunning = true;
    btn.innerHTML = '⏸';
    const interval = Math.max(50, 1000 / playbackSpeed);
    simInterval = setInterval(() => {
      if (currentTimeStep >= totalTimeSteps) {
        togglePlay();
        return;
      }
      currentTimeStep++;
      updateSimUI();
    }, interval);
  }
}

function stepForward() {
  if (currentTimeStep < totalTimeSteps) {
    currentTimeStep++;
    updateSimUI();
  }
}

function stepBack() {
  if (currentTimeStep > 0) {
    currentTimeStep--;
    updateSimUI();
  }
}

function resetSim() {
  currentTimeStep = 0;
  if (simulationRunning) togglePlay();
  updateSimUI();
}

function scrubTime(val) {
  currentTimeStep = parseInt(val);
  updateSimUI();
}

function setSpeed(val) {
  playbackSpeed = parseFloat(val);
  if (simulationRunning) {
    clearInterval(simInterval);
    const interval = Math.max(50, 1000 / playbackSpeed);
    simInterval = setInterval(() => {
      if (currentTimeStep >= totalTimeSteps) { togglePlay(); return; }
      currentTimeStep++;
      updateSimUI();
    }, interval);
  }
}

function jumpToEvent(t) {
  currentTimeStep = t;
  if (simulationRunning) togglePlay();
  updateSimUI();
}

function updateSimUI() {
  const slider = document.getElementById('timeSlider');
  if (slider) slider.value = currentTimeStep;
  const display = document.getElementById('timeDisplay');
  if (display) display.textContent = `T=${currentTimeStep} / ${totalTimeSteps}`;

  // 更新右侧面板
  const rpStep = document.getElementById('rpStep');
  if (rpStep) rpStep.textContent = currentTimeStep;

  // 模拟数据变化
  const gini = 0.380 - (currentTimeStep / totalTimeSteps) * 0.24;
  const rpGini = document.getElementById('rpGini');
  if (rpGini) rpGini.textContent = gini.toFixed(3);

  const matt = 0.22 - (currentTimeStep / totalTimeSteps) * 0.06;
  const rpMatt = document.getElementById('rpMatt');
  if (rpMatt) rpMatt.textContent = matt.toFixed(2);

  const vol = Math.floor(currentTimeStep * 4.7);
  const rpVol = document.getElementById('rpVol');
  if (rpVol) rpVol.textContent = vol;

  updateStatusBar();
}

          <div class="user-list-item" onclick="showUserDetail('${u.name}')">
            <div class="user-list-avatar" style="background:${u.type==='creator'? 'var(--accent-teal)' : u.type==='consumer'? '#6BCB77' : u.type==='intermediary'? '#FFA94D' : 'var(--ink-light)'}">${u.name.slice(-2)}</div>
            <div class="user-list-info">
              <div class="user-list-name">${u.name}</div>
              <div class="user-list-meta">${u.type==='creator'?'创作者':u.type==='consumer'?'消费者':u.type==='intermediary'?'中介':'治理'} · 活跃度 ${u.act} · 信誉 ${u.rep}</div>
            </div>
            <div class="user-list-stat">
              <div class="val">${u.p.toFixed(2)}</div>
              <div class="lbl">势位</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('rightPanel').innerHTML = `
    <div class="panel-section">
      <div class="panel-section-title">选中预览</div>
      <div style="font-size:12px;color:var(--ink-muted);text-align:center;padding:20px">点击左侧 Agent 查看详情</div>
    </div>
  `;
}

function showUserDetail(name) {
  currentModule = 'userDetail';
  renderUserDetail(name);
}

function renderUserDetail(name) {
  const agentName = name || 'Agent-A1';
  const isCreator = agentName.startsWith('A');
  document.getElementById('leftSidebar').innerHTML = `
    <div class="section-title">行为时间轴</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${[
        {t:47,icon:'⇄',desc:'出售Skill-S3'},
        {t:45,icon:'+',desc:'创建Skill-S12'},
        {t:42,icon:'☑',desc:'投票支持提案'},
        {t:38,icon:'↗',desc:'衍生Skill-S8'},
        {t:30,icon:'⇄',desc:'购买Skill-S5'},
        {t:28,icon:'+',desc:'创建Skill-S7'},
        {t:20,icon:'↗',desc:'扩展授权S1'},
        {t:15,icon:'⇄',desc:'交易Skill-S2'},
      ].map(e => `
        <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-paper);border-radius:var(--radius-sm);font-size:11px">
          <span style="color:var(--ink-muted);font-size:10px;width:30px">T=${e.t}</span>
          <span style="width:18px;text-align:center">${e.icon}</span>
          <span>${e.desc}</span>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('centerCanvas').innerHTML = `
    <div class="fade-in">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <button class="btn btn-secondary" style="font-size:11px;padding:4px 10px" onclick="switchModule('user')">← 返回</button>
        <div class="micro-avatar" style="width:36px;height:36px;font-size:14px">A1</div>
        <div>
          <h2 style="font-size:16px">${agentName} (${isCreator?'创作者':'消费者'})</h2>
          <div style="font-size:11px;color:var(--ink-muted)">加入时间: T=0 · 信誉分: 87</div>
        </div>
      </div>

      <div class="micro-tabs">
        <div class="micro-tab active" onclick="switchUserTab('motivation',this)">动机层</div>
        <div class="micro-tab" onclick="switchUserTab('decision',this)">决策层</div>
        <div class="micro-tab" onclick="switchUserTab('behavior',this)">行为层</div>
        <div class="micro-tab" onclick="switchUserTab('network',this)">网络层</div>
      </div>

      <div id="userDetailContent">
        <div style="text-align:center;padding:30px">
          <div class="goal-chart" style="width:140px;height:140px"></div>
          <div class="goal-legend" style="margin-top:12px">
            <div class="goal-legend-item"><div class="goal-legend-dot" style="background:var(--accent-teal)"></div>最大化收益 40%</div>
            <div class="goal-legend-item"><div class="goal-legend-dot" style="background:#6BCB77"></div>影响力 25%</div>
            <div class="goal-legend-item"><div class="goal-legend-dot" style="background:#FFA94D"></div>多样性 20%</div>
            <div class="goal-legend-item"><div class="goal-legend-dot" style="background:var(--ink-light)"></div>稳定性 15%</div>
          </div>
          <div class="card" style="margin-top:20px;text-align:left">
            <div style="font-size:12px;font-weight:600;margin-bottom:8px">目标函数</div>
            <div style="font-size:12px;color:var(--ink-light);line-height:1.6">「在保持生态稳定的前提下，最大化个人收益与影响力。倾向于创建高价值 Skill 并建立广泛的编排关系，避免过度集中导致势位崩塌。」</div>
            <div style="margin-top:12px">
              <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
                <span>目标-行为匹配度</span>
                <span style="color:var(--accent-teal);font-weight:600">78%</span>
              </div>
              <div class="alignment-bar"><div class="alignment-fill" style="width:78%"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('rightPanel').innerHTML = `
    <div class="panel-section">
      <div class="panel-section-title">基本信息</div>
      <div class="kv-row"><span class="kv-key">类型</span><span class="kv-val">创作者</span></div>
      <div class="kv-row"><span class="kv-key">当前势位</span><span class="kv-val" style="color:var(--accent-teal-dark);font-weight:700">0.82</span></div>
      <div class="kv-row"><span class="kv-key">财富</span><span class="kv-val">1,247</span></div>
      <div class="kv-row"><span class="kv-key">信誉分</span><span class="kv-val">87</span></div>
      <div class="kv-row"><span class="kv-key">持有Skill</span><span class="kv-val">12</span></div>
    </div>
    <div class="panel-section">
      <div class="panel-section-title">统计数据</div>
      <div class="kv-row"><span class="kv-key">创建Skill</span><span class="kv-val">7</span></div>
      <div class="kv-row"><span class="kv-key">交易次数</span><span class="kv-val">23</span></div>
      <div class="kv-row"><span class="kv-key">衍生作品</span><span class="kv-val">3</span></div>
      <div class="kv-row"><span class="kv-key">编排关系</span><span class="kv-val">15</span></div>
    </div>
  `;
}

function switchUserTab(tab, el) {
  document.querySelectorAll('.micro-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const content = document.getElementById('userDetailContent');
  if (tab === 'motivation') {
    content.innerHTML = `<div class="fade-in" style="text-align:center;padding:30px">
      <div class="goal-chart" style="width:140px;height:140px"></div>
      <div class="goal-legend" style="margin-top:12px">
        <div class="goal-legend-item"><div class="goal-legend-dot" style="background:var(--accent-teal)"></div>最大化收益 40%</div>
        <div class="goal-legend-item"><div class="goal-legend-dot" style="background:#6BCB77"></div>影响力 25%</div>
        <div class="goal-legend-item"><div class="goal-legend-dot" style="background:#FFA94D"></div>多样性 20%</div>
        <div class="goal-legend-item"><div class="goal-legend-dot" style="background:var(--ink-light)"></div>稳定性 15%</div>
      </div>
    </div>`;
  } else if (tab === 'decision') {
    content.innerHTML = `<div class="decision-log fade-in">
      <div class="decision-item"><div class="ts">T=47</div><div class="content"><div class="type">交易决策</div><div class="reason">将Skill-S3以¥89出售给Agent-B2，预期收益+12%</div></div></div>
      <div class="decision-item"><div class="ts">T=45</div><div class="content"><div class="type">生产决策</div><div class="reason">检测到NLP领域供需缺口，创建新Skill-S12</div></div></div>
      <div class="decision-item"><div class="ts">T=42</div><div class="content"><div class="type">治理投票</div><div class="reason">支持冷却期从5轮延长至7轮的提案</div></div></div>
    </div>`;
  } else if (tab === 'behavior') {
    content.innerHTML = `<div class="fade-in" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-paper);border-radius:var(--radius-sm);border-left:3px solid var(--accent-teal)"><span style="font-size:10px;color:var(--ink-muted);width:32px">T=47</span><span style="font-size:14px;width:20px;text-align:center">⇄</span><span style="font-size:12px">出售Skill-S3给Agent-B2</span></div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-paper);border-radius:var(--radius-sm);border-left:3px solid #6BCB77"><span style="font-size:10px;color:var(--ink-muted);width:32px">T=45</span><span style="font-size:14px;width:20px;text-align:center">+</span><span style="font-size:12px">创建Skill-S12</span></div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-paper);border-radius:var(--radius-sm);border-left:3px solid #FFA94D"><span style="font-size:10px;color:var(--ink-muted);width:32px">T=38</span><span style="font-size:14px;width:20px;text-align:center">↗</span><span style="font-size:12px">衍生创建Skill-S8</span></div>
    </div>`;
  } else {
    content.innerHTML = `<div class="fade-in" style="text-align:center;padding:40px;color:var(--ink-muted)"><div style="font-size:40px;margin-bottom:12px;opacity:0.3">🕸️</div><div style="font-size:13px">网络关系图</div><div style="font-size:11px;margin-top:4px">上下游3层关系可视化</div></div>`;
  }
}

// ==================== 浏览器切换 ====================
function toggleBrowser(type) {
  if (type === 'resource') switchModule('resource');
  else switchModule('user');
}

// ==================== 状态栏 ====================
function updateStatusBar() {
  document.getElementById('statusStep').textContent = currentModule === 'simulation' ? currentTimeStep : '—';
  document.getElementById('statusAgents').textContent = currentModule === 'simulation' ? '23' : '—';
  document.getElementById('statusTx').textContent = currentModule === 'simulation' ? Math.floor(currentTimeStep * 0.7) : '—';
}

// ==================== 初始化 ====================
renderConfig();
</script>

</body>
</html>
