<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO 规则与经济模拟器</title>
<style>
  :root {
    --bg: #0c0c0e;
    --bg2: #1a1a1e;
    --bg3: #2a2a30;
    --border: #3a3a42;
    --text: #f0f0e8;
    --text2: #d0d0c8;
    --text3: #8a8a90;
    --red: #c45c48;
    --blue: #4a90a4;
    --green: #5a9a6e;
    --gold: #c8a84c;
    --purple: #8b6db3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

  /* Header */
  .header { text-align: center; padding: 20px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
  .header p { color: var(--text3); font-size: 13px; }
  .header .subtitle { color: var(--gold); font-size: 12px; margin-top: 4px; }

  /* Controls */
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 16px; background: var(--bg2); border-radius: 8px; margin-bottom: 24px;
  }
  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { font-size: 12px; color: var(--text3); white-space: nowrap; }
  .control-group input, .control-group select {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none;
  }
  button {
    padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all 0.2s;
  }
  .btn-primary { background: var(--red); color: var(--text); }
  .btn-primary:hover { background: #d06b58; }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-active { background: var(--green); }

  /* Two-track layout */
  .tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 900px) { .tracks { grid-template-columns: 1fr; } }

  .track {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; position: relative;
  }
  .track-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .track-title { font-size: 16px; font-weight: 700; }
  .track-badge {
    padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .badge-echo { background: rgba(90,154,110,0.15); color: var(--green); }
  .badge-market { background: rgba(138,138,144,0.15); color: var(--text3); }

  /* Metrics */
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  .metric {
    background: var(--bg); border-radius: 6px; padding: 12px; text-align: center;
  }
  .metric-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .metric-value { font-size: 20px; font-weight: 700; font-family: monospace; }
  .metric-delta { font-size: 11px; margin-top: 2px; }
  .metric-delta.up { color: var(--green); }
  .metric-delta.down { color: var(--red); }

  /* Charts */
  .chart-container {
    height: 180px; background: var(--bg); border-radius: 6px; padding: 12px;
    margin-bottom: 16px; position: relative;
  }
  .chart-title { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
  canvas { width: 100%; height: calc(100% - 24px); }

  /* Event log */
  .log-container {
    max-height: 200px; overflow-y: auto; font-size: 12px;
    background: var(--bg); border-radius: 6px; padding: 12px;
  }
  .log-item { padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  .log-item:last-child { border-bottom: none; }
  .log-round { color: var(--text3); min-width: 40px; font-family: monospace; }
  .log-type { padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
  .log-type-create { background: rgba(196,92,72,0.2); color: var(--red); }
  .log-type-trade { background: rgba(74,144,164,0.2); color: var(--blue); }
  .log-type-derive { background: rgba(90,154,110,0.2); color: var(--green); }
  .log-type-view { background: rgba(200,168,76,0.2); color: var(--gold); }
  .log-content { flex: 1; color: var(--text2); }
  .log-amount { color: var(--gold); font-weight: 600; font-family: monospace; }

  /* Comparison panel */
  .comparison {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; margin-bottom: 24px;
  }
  .comparison h3 { font-size: 16px; margin-bottom: 16px; }
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .compare-item { text-align: center; padding: 16px; background: var(--bg); border-radius: 6px; }
  .compare-item h4 { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
  .compare-values { display: flex; justify-content: center; gap: 24px; }
  .compare-val { text-align: center; }
  .compare-val .val { font-size: 24px; font-weight: 700; font-family: monospace; }
  .compare-val .label { font-size: 11px; color: var(--text3); }
  .compare-val.echo .val { color: var(--green); }
  .compare-val.market .val { color: var(--text3); }
  .diff-bar {
    height: 6px; background: var(--bg3); border-radius: 3px; margin-top: 8px;
    position: relative; overflow: hidden;
  }
  .diff-bar-fill {
    height: 100%; border-radius: 3px; background: var(--green);
    transition: width 0.5s ease;
  }

  /* Legend */
  .legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* Tooltip */
  .tooltip {
    position: absolute; background: var(--bg3); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 4px; font-size: 12px; pointer-events: none;
    z-index: 100; display: none; max-width: 200px;
  }

  /* View level indicator */
  .view-levels { display: flex; gap: 2px; margin-bottom: 12px; }
  .view-level {
    flex: 1; text-align: center; padding: 6px 2px; font-size: 10px; font-weight: 600;
    border-radius: 3px; color: var(--text3);
  }
  .view-level.active { color: var(--text); }
  .view-level.l0 { background: rgba(196,92,72,0.3); }
  .view-level.l1 { background: rgba(196,92,72,0.2); }
  .view-level.l2 { background: rgba(200,168,76,0.2); }
  .view-level.l3 { background: rgba(200,168,76,0.3); }
  .view-level.l4 { background: rgba(74,144,164,0.3); }
  .view-level.l5 { background: rgba(90,154,110,0.3); }

  /* Status bar */
  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 8px 20px; font-size: 12px; color: var(--text3);
    display: flex; justify-content: space-between; align-items: center;
  }

  /* Settings panel */
  .settings {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; margin-bottom: 24px;
  }
  .settings h3 { font-size: 14px; margin-bottom: 12px; color: var(--text3); }
  .setting-row { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .setting-row label { font-size: 12px; color: var(--text3); min-width: 120px; }
  .setting-row input[type="range"] { flex: 1; max-width: 200px; }
  .setting-value { font-size: 12px; color: var(--text); font-family: monospace; min-width: 40px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>ECHO 规则与经济模拟器</h1>
    <p>双轨对比实验：有 ECHO 视图约束 vs 纯市场自由生长</p>
    <div class="subtitle">核心差异：6档视图（L0-L5）对生态演化的结构性影响</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="control-group">
      <label>模拟轮数</label>
      <input type="number" id="roundsInput" value="500" min="100" max="5000" step="100">
    </div>
    <div class="control-group">
      <label>Agent数量</label>
      <input type="number" id="agentsInput" value="100" min="50" max="500" step="50">
    </div>
    <div class="control-group">
      <label>初始资源</label>
      <input type="number" id="resourcesInput" value="20" min="10" max="100">
    </div>
    <div class="control-group">
      <label>随机种子</label>
      <input type="number" id="seedInput" value="42">
    </div>
    <button class="btn-primary" id="startBtn" onclick="startSimulation()">开始模拟</button>
    <button class="btn-secondary" id="pauseBtn" onclick="togglePause()">暂停</button>
    <button class="btn-secondary" onclick="resetSimulation()">重置</button>
    <div class="control-group" style="margin-left:auto;">
      <label>速度</label>
      <select id="speedSelect">
        <option value="1">1x</option>
        <option value="5">5x</option>
        <option value="10" selected>10x</option>
        <option value="50">50x</option>
      </select>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings">
    <h3>⚙️ 规则参数配置</h3>
    <div class="setting-row">
      <label>创作者占比</label>
      <input type="range" id="creatorRatio" min="10" max="40" value="20">
      <span class="setting-value" id="creatorRatioVal">20%</span>
    </div>
    <div class="setting-row">
      <label>保守型创作者比例</label>
      <input type="range" id="conservativeRatio" min="0" max="100" value="30">
      <span class="setting-value" id="conservativeRatioVal">30%</span>
    </div>
    <div class="setting-row">
      <label>分润链层数</label>
      <input type="range" id="profitDepth" min="1" max="5" value="3">
      <span class="setting-value" id="profitDepthVal">3层</span>
    </div>
    <div class="setting-row">
      <label>母资源分润比例</label>
      <input type="range" id="parentShare" min="0" max="50" value="15">
      <span class="setting-value" id="parentShareVal">15%</span>
    </div>
    <div class="setting-row">
      <label>L4共识延迟（轮）</label>
      <input type="range" id="consensusDelay" min="1" max="20" value="5">
      <span class="setting-value" id="consensusDelayVal">5轮</span>
    </div>
  </div>

  <!-- Tracks -->
  <div class="tracks">
    <!-- ECHO Track -->
    <div class="track">
      <div class="track-header">
        <span class="track-title">ECHO 世界</span>
        <span class="track-badge badge-echo">视图约束生效</span>
      </div>
      <div class="view-levels" id="echoViewLevels">
        <div class="view-level l0">L0<br>禁</div>
        <div class="view-level l1">L1<br>己</div>
        <div class="view-level l2">L2<br>白</div>
        <div class="view-level l3">L3<br>约</div>
        <div class="view-level l4">L4<br>共</div>
        <div class="view-level l5">L5<br>公</div>
      </div>
      <div class="metrics" id="echoMetrics"></div>
      <div class="chart-container">
        <div class="chart-title">资源总量 & 交易活跃度</div>
        <canvas id="echoChart1"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">创作者收入分布（基尼系数：<span id="echoGini">-</span>）</div>
        <canvas id="echoChart2"></canvas>
      </div>
      <div class="log-container" id="echoLog">
        <div style="color:var(--text3); text-align:center; padding:20px;">等待模拟开始...</div>
      </div>
    </div>

    <!-- Market Track -->
    <div class="track">
      <div class="track-header">
        <span class="track-title">纯市场世界</span>
        <span class="track-badge badge-market">无视图约束</span>
      </div>
      <div class="metrics" id="marketMetrics"></div>
      <div class="chart-container">
        <div class="chart-title">资源总量 & 交易活跃度</div>
        <canvas id="marketChart1"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">创作者收入分布（基尼系数：<span id="marketGini">-</span>）</div>
        <canvas id="marketChart2"></canvas>
      </div>
      <div class="log-container" id="marketLog">
        <div style="color:var(--text3); text-align:center; padding:20px;">等待模拟开始...</div>
      </div>
    </div>
  </div>

  <!-- Comparison -->
  <div class="comparison">
    <h3>📊 双轨对比核心指标</h3>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> ECHO 世界</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--text3)"></div> 纯市场世界</div>
    </div>
    <div class="compare-grid" id="comparisonGrid"></div>
  </div>
</div>

<div class="status-bar">
  <span id="statusText">就绪</span>
  <span id="progressText">Round 0 / 500</span>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ===== 配置与常量 =====
const VIEW_LEVELS = ['L0禁', 'L1己', 'L2白', 'L3约', 'L4共', 'L5公'];
const VIEW_NAMES = ['不开放', '仅自用', '白名单', '规则授权', '共识授权', '纯公开'];

// 伪随机数生成器（可复现）
class PRNG {
  constructor(seed) { this.seed = seed; }
  next() {
    this.seed = (this.seed * 16807 + 0) % 2147483647;
    return (this.seed - 1) / 2147483646;
  }
  range(min, max) { return min + this.next() * (max - min); }
  int(min, max) { return Math.floor(this.range(min, max + 1)); }
  choice(arr) { return arr[this.int(0, arr.length - 1)]; }
  bool(prob) { return this.next() < prob; }
}

// ===== Agent 定义 =====
class Agent {
  constructor(id, type, prng, worldType) {
    this.id = id;
    this.type = type; // creator, user, derivator, speculator
    this.worldType = worldType; // 'echo' | 'market'
    this.balance = prng.range(50, 200);
    this.reputation = prng.range(0, 1);
    this.ownedResources = [];
    this.createdResources = [];
    this.totalIncome = 0;
    this.totalSpent = 0;
    this.actionHistory = [];

    // 创作者特性
    if (type === 'creator') {
      this.conservative = prng.bool(parseFloat(document.getElementById('conservativeRatio').value) / 100);
    }
  }
}

// ===== 资源定义 =====
class Resource {
  constructor(id, creator, prng, worldType) {
    this.id = id;
    this.creator = creator;
    this.creationRound = 0;
    this.worldType = worldType;

    if (worldType === 'echo') {
      this.viewLevel = creator.conservative ? prng.int(0, 2) : prng.int(2, 5);
    } else {
      this.viewLevel = 5; // 纯市场 = 无限制
    }

    this.price = prng.range(5, 50);
    this.basePrice = this.price;
    this.quality = prng.range(0.3, 1.0);
    this.category = prng.choice(['音乐', '视觉', '文字', '代码', '数据']);
    this.parentId = null; // 衍生来源
    this.derivedCount = 0;
    this.revenueShared = 0;
    this.licenseCount = 0;
    this.active = true;
  }
}

// ===== 交易记录 =====
class Transaction {
  constructor(round, buyer, seller, resource, amount, type) {
    this.round = round;
    this.buyer = buyer;
    this.seller = seller;
    this.resource = resource;
    this.amount = amount;
    this.type = type; // 'purchase', 'derivative', 'license'
  }
}

// ===== 世界状态 =====
class World {
  constructor(type, config, prng) {
    this.type = type; // 'echo' | 'market'
    this.config = config;
    this.prng = prng;
    this.round = 0;
    this.agents = [];
    this.resources = [];
    this.transactions = [];
    this.events = [];
    this.metrics = [];
    this.nextId = 0;
    this.init();
  }

  init() {
    const creatorCount = Math.floor(this.config.agentCount * this.config.creatorRatio);
    const derivatorCount = Math.floor(this.config.agentCount * 0.2);
    const speculatorCount = Math.floor(this.config.agentCount * 0.1);
    const userCount = this.config.agentCount - creatorCount - derivatorCount - speculatorCount;

    for (let i = 0; i < creatorCount; i++) this.agents.push(new Agent(this.nextId++, 'creator', this.prng, this.type));
    for (let i = 0; i < derivatorCount; i++) this.agents.push(new Agent(this.nextId++, 'derivator', this.prng, this.type));
    for (let i = 0; i < speculatorCount; i++) this.agents.push(new Agent(this.nextId++, 'speculator', this.prng, this.type));
    for (let i = 0; i < userCount; i++) this.agents.push(new Agent(this.nextId++, 'user', this.prng, this.type));

    // 初始资源
    const creators = this.agents.filter(a => a.type === 'creator');
    for (let i = 0; i < this.config.initialResources; i++) {
      const creator = this.prng.choice(creators);
      const r = new Resource(this.nextId++, creator, this.prng, this.type);
      r.creationRound = 0;
      this.resources.push(r);
      creator.createdResources.push(r.id);
    }
  }

  step() {
    this.round++;
    const activeResources = this.resources.filter(r => r.active);

    // 1. 创作者创建新资源
    const creators = this.agents.filter(a => a.type === 'creator' && a.balance > 20);
    for (const creator of creators) {
      if (this.prng.bool(0.05)) { // 5% 概率创建
        const r = new Resource(this.nextId++, creator, this.prng, this.type);
        r.creationRound = this.round;
        this.resources.push(r);
        creator.createdResources.push(r.id);
        creator.balance -= 10; // 创建成本
        this.addEvent('create', `创作者 #${creator.id} 创建资源 #${r.id} (${VIEW_NAMES[r.viewLevel]})`, creator.id);
      }
    }

    // 2. 使用者购买
    const users = this.agents.filter(a => a.type === 'user');
    for (const user of users) {
      if (activeResources.length === 0) break;
      const r = this.prng.choice(activeResources);
      const canAccess = this.checkAccess(user, r);
      if (canAccess && user.balance >= r.price) {
        const success = this.executeTrade(user, r, 'purchase');
        if (success) {
          this.addEvent('trade', `用户 #${user.id} 购买资源 #${r.id}`, user.id, r.price);
        }
      }
    }

    // 3. 衍生者创建衍生资源
    if (this.type === 'echo') {
      const derivators = this.agents.filter(a => a.type === 'derivator' && a.balance > 30);
      for (const derivator of derivators) {
        const parentCandidates = activeResources.filter(r => r.viewLevel >= 3);
        if (parentCandidates.length === 0) continue;
        const parent = this.prng.choice(parentCandidates);
        if (this.prng.bool(0.08)) { // 8% 概率衍生
          const r = new Resource(this.nextId++, derivator, this.prng, this.type);
          r.parentId = parent.id;
          r.creationRound = this.round;
          r.price = parent.price * this.prng.range(0.5, 1.5);
          this.resources.push(r);
          parent.derivedCount++;
          derivator.balance -= 15; // 衍生成本
          this.addEvent('derive', `衍生者 #${derivator.id} 基于 #${parent.id} 创建衍生 #${r.id}`, derivator.id);
        }
      }
    } else {
      // 纯市场：自由fork，无归属链
      const derivators = this.agents.filter(a => a.type === 'derivator' && a.balance > 30);
      for (const derivator of derivators) {
        if (activeResources.length === 0) continue;
        const parent = this.prng.choice(activeResources);
        if (this.prng.bool(0.1)) { // 更高概率，因为没有约束
          const r = new Resource(this.nextId++, derivator, this.prng, this.type);
          r.parentId = null; // 无归属链
          r.creationRound = this.round;
          r.price = parent.price * this.prng.range(0.5, 1.5);
          this.resources.push(r);
          derivator.balance -= 10; // 成本更低
          this.addEvent('derive', `衍生者 #${derivator.id} fork 资源 #${parent.id}`, derivator.id);
        }
      }
    }

    // 4. 投机者套利
    const speculators = this.agents.filter(a => a.type === 'speculator');
    for (const spec of speculators) {
      if (activeResources.length === 0) break;
      const r = this.prng.choice(activeResources);
      if (spec.balance >= r.price && this.prng.bool(0.03)) {
        this.executeTrade(spec, r, 'purchase');
        // 投机者试图高价转卖（模拟）
        r.price *= 1.1;
      }
    }

    // 5. ECHO 特有：分润结算
    if (this.type === 'echo') {
      for (const r of this.resources) {
        if (r.parentId !== null && r.licenseCount > 0) {
          const parent = this.resources.find(res => res.id === r.parentId);
          if (parent) {
            const share = r.price * (this.config.parentShare / 100);
            r.revenueShared += share;
            // 给母资源创作者分润
            const parentCreator = this.agents.find(a => a.id === parent.creator.id);
            if (parentCreator) {
              parentCreator.balance += share;
              parentCreator.totalIncome += share;
            }
          }
        }
      }
    }

    // 6. 资源价格演化
    for (const r of activeResources) {
      const demand = this.transactions.filter(t => t.resource.id === r.id && t.round >= this.round - 10).length;
      r.price = r.basePrice * (1 + demand * 0.05) * (0.95 + this.prng.range(0, 0.1));
    }

    // 记录指标
    this.recordMetrics();
  }

  checkAccess(agent, resource) {
    if (this.type === 'market') return true; // 纯市场无限制
    switch (resource.viewLevel) {
      case 0: return false; // 不开放
      case 1: return agent.id === resource.creator.id; // 仅自用
      case 2: // 白名单（简化：随机概率）
        return this.prng.bool(0.3) || agent.id === resource.creator.id;
      case 3: // 规则授权：有钱就行
        return agent.balance >= resource.price;
      case 4: // 共识授权：延迟
        return this.round >= resource.creationRound + this.config.consensusDelay;
      case 5: return true; // 纯公开
      default: return true;
    }
  }

  executeTrade(buyer, resource, type) {
    const seller = resource.creator;
    const amount = resource.price;
    if (buyer.balance < amount) return false;

    buyer.balance -= amount;
    buyer.totalSpent += amount;
    seller.balance += amount;
    seller.totalIncome += amount;
    resource.licenseCount++;

    this.transactions.push(new Transaction(this.round, buyer, seller, resource, amount, type));
    return true;
  }

  addEvent(type, content, actorId, amount) {
    this.events.push({ round: this.round, type, content, actorId, amount });
    if (this.events.length > 100) this.events.shift();
  }

  recordMetrics() {
    const activeResources = this.resources.filter(r => r.active);
    const creators = this.agents.filter(a => a.type === 'creator');
    const incomes = creators.map(c => c.totalIncome);
    const gini = this.calcGini(incomes);

    this.metrics.push({
      round: this.round,
      resourceCount: activeResources.length,
      transactionCount: this.transactions.filter(t => t.round === this.round).length,
      totalTradeVolume: this.transactions.filter(t => t.round === this.round).reduce((s, t) => s + t.amount, 0),
      avgPrice: activeResources.length > 0 ? activeResources.reduce((s, r) => s + r.price, 0) / activeResources.length : 0,
      giniCoefficient: gini,
      creatorIncome: incomes.reduce((s, i) => s + i, 0),
      derivedCount: this.resources.filter(r => r.parentId !== null).length,
      avgViewLevel: this.type === 'echo' ? activeResources.reduce((s, r) => s + r.viewLevel, 0) / activeResources.length : 5,
    });
  }

  calcGini(arr) {
    if (arr.length === 0) return 0;
    const sorted = [...arr].sort((a, b) => a - b);
    const n = sorted.length;
    let num = 0;
    for (let i = 0; i < n; i++) num += (2 * (i + 1) - n - 1) * sorted[i];
    return num / (n * sorted.reduce((s, v) => s + v, 0)) || 0;
  }
}

// ===== 模拟器控制 =====
let echoWorld = null;
let marketWorld = null;
let isRunning = false;
let isPaused = false;
let currentRound = 0;
let totalRounds = 500;
let timer = null;
let echoChart1Data = [];
let echoChart2Data = [];
let marketChart1Data = [];
let marketChart2Data = [];

function startSimulation() {
  resetSimulation();
  const config = {
    agentCount: parseInt(document.getElementById('agentsInput').value),
    initialResources: parseInt(document.getElementById('resourcesInput').value),
    creatorRatio: parseFloat(document.getElementById('creatorRatio').value) / 100,
    conservativeRatio: parseFloat(document.getElementById('conservativeRatio').value),
    profitDepth: parseInt(document.getElementById('profitDepth').value),
    parentShare: parseFloat(document.getElementById('parentShare').value),
    consensusDelay: parseInt(document.getElementById('consensusDelay').value),
  };
  const seed = parseInt(document.getElementById('seedInput').value);
  totalRounds = parseInt(document.getElementById('roundsInput').value);

  echoWorld = new World('echo', config, new PRNG(seed));
  marketWorld = new World('market', config, new PRNG(seed)); // 相同种子保证公平

  echoChart1Data = [];
  echoChart2Data = [];
  marketChart1Data = [];
  marketChart2Data = [];

  isRunning = true;
  isPaused = false;
  currentRound = 0;
  updateStatus('运行中');
  runStep();
}

function runStep() {
  if (!isRunning || isPaused) return;
  const speed = parseInt(document.getElementById('speedSelect').value);

  for (let i = 0; i < speed && currentRound < totalRounds; i++) {
    echoWorld.step();
    marketWorld.step();
    currentRound++;
  }

  render();
  updateProgress();

  if (currentRound < totalRounds) {
    timer = setTimeout(runStep, 50);
  } else {
    isRunning = false;
    updateStatus('完成');
    renderComparison();
  }
}

function togglePause() {
  isPaused = !isPaused;
  document.getElementById('pauseBtn').textContent = isPaused ? '继续' : '暂停';
  document.getElementById('pauseBtn').className = isPaused ? 'btn-secondary btn-active' : 'btn-secondary';
  updateStatus(isPaused ? '已暂停' : '运行中');
  if (!isPaused) runStep();
}

function resetSimulation() {
  isRunning = false;
  isPaused = false;
  currentRound = 0;
  if (timer) clearTimeout(timer);
  echoWorld = null;
  marketWorld = null;
  document.getElementById('pauseBtn').textContent = '暂停';
  document.getElementById('pauseBtn').className = 'btn-secondary';
  updateStatus('就绪');
  updateProgress();
  clearRender();
}

function updateStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function updateProgress() {
  document.getElementById('progressText').textContent = `Round ${currentRound} / ${totalRounds}`;
}

// ===== 渲染 =====
function render() {
  if (!echoWorld || !marketWorld) return;
  renderMetrics(echoWorld, 'echo');
  renderMetrics(marketWorld, 'market');
  renderLogs();
  renderCharts();
}

function clearRender() {
  document.getElementById('echoMetrics').innerHTML = '<div class="metric"><div class="metric-label">等待开始</div></div>';
  document.getElementById('marketMetrics').innerHTML = '<div class="metric"><div class="metric-label">等待开始</div></div>';
  document.getElementById('echoLog').innerHTML = '<div style="color:var(--text3); text-align:center; padding:20px;">等待模拟开始...</div>';
  document.getElementById('marketLog').innerHTML = '<div style="color:var(--text3); text-align:center; padding:20px;">等待模拟开始...</div>';
  document.getElementById('echoGini').textContent = '-';
  document.getElementById('marketGini').textContent = '-';
  document.getElementById('comparisonGrid').innerHTML = '';
  clearCanvas('echoChart1'); clearCanvas('echoChart2');
  clearCanvas('marketChart1'); clearCanvas('marketChart2');
}

function clearCanvas(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
}

function renderMetrics(world, prefix) {
  const m = world.metrics[world.metrics.length - 1];
  if (!m) return;
  const prev = world.metrics[world.metrics.length - 2] || m;
  const container = document.getElementById(prefix + 'Metrics');

  const metrics = [
    { label: '资源总量', value: m.resourceCount, prev: prev.resourceCount, fmt: v => v.toString() },
    { label: '本轮交易', value: m.transactionCount, prev: prev.transactionCount, fmt: v => v.toString() },
    { label: '平均价格', value: m.avgPrice, prev: prev.avgPrice, fmt: v => '¥' + v.toFixed(1) },
    { label: '基尼系数', value: m.giniCoefficient, prev: prev.giniCoefficient, fmt: v => v.toFixed(3) },
  ];

  container.innerHTML = metrics.map(met => {
    const delta = met.value - met.prev;
    const deltaStr = delta > 0 ? `+${delta.toFixed(1)}` : delta.toFixed(1);
    const deltaClass = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
    return `
      <div class="metric">
        <div class="metric-label">${met.label}</div>
        <div class="metric-value" style="color:${prefix === 'echo' ? 'var(--green)' : 'var(--text3)'}">${met.fmt(met.value)}</div>
        ${Math.abs(delta) > 0.001 ? `<div class="metric-delta ${deltaClass}">${deltaStr}</div>` : ''}
      </div>
    `;
  }).join('');

  document.getElementById(prefix + 'Gini').textContent = m.giniCoefficient.toFixed(3);
}

function renderLogs() {
  const renderLog = (world, containerId) => {
    const container = document.getElementById(containerId);
    const events = world.events.slice(-20).reverse();
    if (events.length === 0) return;
    container.innerHTML = events.map(e => `
      <div class="log-item">
        <span class="log-round">R${e.round}</span>
        <span class="log-type log-type-${e.type}">${e.type}</span>
        <span class="log-content">${e.content} ${e.amount ? `<span class="log-amount">¥${e.amount.toFixed(1)}</span>` : ''}</span>
      </div>
    `).join('');
  };
  renderLog(echoWorld, 'echoLog');
  renderLog(marketWorld, 'marketLog');
}

function renderCharts() {
  if (!echoWorld || !marketWorld) return;
  const em = echoWorld.metrics;
  const mm = marketWorld.metrics;
  if (em.length < 2) return;

  drawLineChart('echoChart1', em.map(m => ({ x: m.round, y1: m.resourceCount, y2: m.transactionCount })), '资源', '交易');
  drawLineChart('marketChart1', mm.map(m => ({ x: m.round, y1: m.resourceCount, y2: m.transactionCount })), '资源', '交易');
  drawLineChart('echoChart2', em.map(m => ({ x: m.round, y1: m.giniCoefficient * 100, y2: m.creatorIncome / 10 })), '基尼×100', '收入/10');
  drawLineChart('marketChart2', mm.map(m => ({ x: m.round, y1: m.giniCoefficient * 100, y2: m.creatorIncome / 10 })), '基尼×100', '收入/10');
}

function drawLineChart(canvasId, data, label1, label2) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = canvas.offsetHeight;
  if (!data.length) return;

  ctx.clearRect(0, 0, w, h);
  const padding = 30;
  const chartW = w - padding * 2;
  const chartH = h - padding * 2;

  const max1 = Math.max(...data.map(d => d.y1), 1);
  const max2 = Math.max(...data.map(d => d.y2), 1);
  const maxRound = data[data.length - 1].x;

  // Grid
  ctx.strokeStyle = '#3a3a42';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = padding + chartH * i / 4;
    ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(w - padding, y); ctx.stroke();
  }

  // Line 1
  ctx.strokeStyle = '#5a9a6e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = padding + (d.x / maxRound) * chartW;
    const y = padding + chartH - (d.y1 / max1) * chartH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Line 2
  ctx.strokeStyle = '#c8a84c';
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = padding + (d.x / maxRound) * chartW;
    const y = padding + chartH - (d.y2 / max2) * chartH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function renderComparison() {
  if (!echoWorld || !marketWorld) return;
  const em = echoWorld.metrics[echoWorld.metrics.length - 1];
  const mm = marketWorld.metrics[marketWorld.metrics.length - 1];
  if (!em || !mm) return;

  const items = [
    { label: '最终资源总量', echo: em.resourceCount, market: mm.resourceCount },
    { label: '总交易量', echo: echoWorld.transactions.length, market: marketWorld.transactions.length },
    { label: '衍生资源数', echo: em.derivedCount, market: mm.derivedCount },
    { label: '创作者基尼系数', echo: em.giniCoefficient, market: mm.giniCoefficient, lowerIsBetter: true },
    { label: '平均资源价格', echo: em.avgPrice, market: mm.avgPrice },
    { label: '平均视图档位', echo: em.avgViewLevel, market: 5 },
  ];

  document.getElementById('comparisonGrid').innerHTML = items.map(item => {
    const max = Math.max(item.echo, item.market, 0.001);
    const echoPct = (item.echo / max) * 100;
    const marketPct = (item.market / max) * 100;
    const diff = item.echo - item.market;
    const diffStr = diff > 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1);
    const diffColor = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'var(--text3)';

    return `
      <div class="compare-item">
        <h4>${item.label}</h4>
        <div class="compare-values">
          <div class="compare-val echo">
            <div class="val">${typeof item.echo === 'number' ? item.echo.toFixed(1) : item.echo}</div>
            <div class="label">ECHO</div>
          </div>
          <div class="compare-val market">
            <div class="val">${typeof item.market === 'number' ? item.market.toFixed(1) : item.market}</div>
            <div class="label">纯市场</div>
          </div>
        </div>
        <div style="font-size:11px; color:${diffColor}; margin-top:4px;">差异: ${diffStr}</div>
        <div class="diff-bar">
          <div class="diff-bar-fill" style="width:${echoPct}%; background:${diff > 0 ? 'var(--green)' : 'var(--red)'}; opacity:0.5;"></div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== 设置面板事件 =====
document.getElementById('creatorRatio').addEventListener('input', e => {
  document.getElementById('creatorRatioVal').textContent = e.target.value + '%';
});
document.getElementById('conservativeRatio').addEventListener('input', e => {
  document.getElementById('conservativeRatioVal').textContent = e.target.value + '%';
});
document.getElementById('profitDepth').addEventListener('input', e => {
  document.getElementById('profitDepthVal').textContent = e.target.value + '层';
});
document.getElementById('parentShare').addEventListener('input', e => {
  document.getElementById('parentShareVal').textContent = e.target.value + '%';
});
document.getElementById('consensusDelay').addEventListener('input', e => {
  document.getElementById('consensusDelayVal').textContent = e.target.value + '轮';
});

// 初始化
updateStatus('就绪');
updateProgress();
</script>
