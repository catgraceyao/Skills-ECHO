<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「画」- ECHO视觉模块</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        :root {
            --ink: #1a1a1a;
            --cinnabar: #c93756;
            --paper: #f5f0e8;
            --verdant: #4a7c59;
            --lush: #6b8e6b;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--paper);
        }
        
        .font-serif { font-family: 'Noto Serif SC', serif; }
        
        .brush-cursor {
            cursor: crosshair;
        }
        
        .tool-btn {
            transition: all 0.2s ease;
        }
        
        .tool-btn:hover, .tool-btn.active {
            background: var(--verdant);
            color: white;
        }
        
        .color-swatch {
            transition: transform 0.2s ease;
        }
        
        .color-swatch:hover {
            transform: scale(1.2);
        }
        
        .layer-item {
            transition: all 0.2s ease;
        }
        
        .layer-item:hover {
            background: rgba(74, 124, 89, 0.1);
        }
        
        .artwork-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .artwork-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(26,26,26,0.1);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 导航栏 -->
    <nav class="fixed top-0 w-full bg-[#f5f0e8]/95 backdrop-blur-sm border-b border-[#1a1a1a]/10 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 border-2 border-[#4a7c59] text-[#4a7c59] rounded flex items-center justify-center text-lg font-serif font-bold">画</div>
                    <span class="font-serif text-2xl font-bold">ECHO「画」</span>
                </div>
                
                <div class="flex items-center space-x-6">
                    <a href="echo-home.html" class="text-[#4a5568] hover:text-[#1a1a1a] transition">首页</a>
                    <a href="echo-yin.html" class="text-[#4a5568] hover:text-[#1a1a1a] transition">音</a>
                    <a href="echo-wen.html" class="text-[#4a5568] hover:text-[#1a1a1a] transition">文</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button class="px-4 py-2 bg-[#4a7c59] text-white rounded-lg hover:bg-[#4a7c59]/90 transition">
                        创作新作
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-16">
        <!-- 「绘」编辑器 -->
        <section class="py-8 max-w-7xl mx-auto px-6">
            <div class="bg-white rounded-2xl shadow-sm border border-[#1a1a1a]/5 overflow-hidden">
                <!-- 编辑器工具栏 -->
                <div class="border-b border-[#1a1a1a]/10 p-4 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <span class="font-serif text-lg font-bold">「绘」编辑器</span>
                        <span class="text-sm text-[#4a5568]">山水画卷 · 1200×800px</span>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <button class="px-3 py-1.5 text-sm bg-[#1a1a1a]/5 rounded hover:bg-[#1a1a1a]/10 transition">撤销</button>
                        <button class="px-3 py-1.5 text-sm bg-[#1a1a1a]/5 rounded hover:bg-[#1a1a1a]/10 transition">重做</button>
                        <span class="text-[#1a1a1a]/20">|</span>
                        <button class="px-3 py-1.5 text-sm bg-[#4a7c59] text-white rounded hover:bg-[#4a7c59]/90 transition">保存</button>
                        <button class="px-3 py-1.5 text-sm bg-[#c93756] text-white rounded hover:bg-[#c93756]/90 transition">铸造</button>
                    </div>
                </div>
                
                <div class="flex h-[600px]">
                    <!-- 左侧工具面板 -->
                    <div class="w-20 border-r border-[#1a1a1a]/10 p-4 flex flex-col items-center space-y-4">
                        <div class="tool-btn active w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="画笔">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
                        </div>
                        
                        <div class="tool-btn w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="橡皮擦">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a2 2 0 00-2 2v11a3 3 0 106 0V4a2 2 0 00-2-2H4zm1 14a1 1 0 100-2 1 1 0 000 2zm5-1.757l4.9-4.9a2 2 0 000-2.828L13.485 5.1a2 2 0 00-2.828 0L10 5.757v8.486zM16 18H9.071l6-6H16a2 2 0 012 2v2a2 2 0 01-2 2z" clip-rule="evenodd"/></svg>
                        </div>
                        
                        <div class="tool-btn w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="填充">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a2 2 0 00-2 2v11a3 3 0 106 0V4a2 2 0 00-2-2H4zm1 14a1 1 0 100-2 1 1 0 000 2zm5-1.757l4.9-4.9a2 2 0 000-2.828L13.485 5.1a2 2 0 00-2.828 0L10 5.757v8.486zM16 18H9.071l6-6H16a2 2 0 012 2v2a2 2 0 01-2 2z" clip-rule="evenodd"/></svg>
                        </div>
                        
                        <div class="tool-btn w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="形状">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm0-2a6 6 0 100-12 6 6 0 000 12z" clip-rule="evenodd"/></svg>
                        </div>
                        
                        <div class="tool-btn w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="文本">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
                        </div>
                        
                        <div class="border-t border-[#1a1a1a]/20 w-full my-2"></div>
                        
                        <div class="tool-btn w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="印章">
                            <span class="text-sm font-serif">印</span>
                        </div>
                        
                        <div class="tool-btn w-12 h-12 rounded-xl border border-[#1a1a1a]/20 flex items-center justify-center cursor-pointer" title="印章">
                            <span class="text-sm font-serif">章</span>
                        </div>
                    </div>
                    
                    
                    <!-- 主画布区域 -->
                    <div class="flex-1 bg-[#f5f0e8] p-8 flex items-center justify-center">
                        <div class="bg-white rounded-lg shadow-lg overflow-hidden" style="width: 800px; height: 500px;">
                            <!-- 画布内容示意 -->
                            <div class="w-full h-full relative bg-gradient-to-b from-blue-100 to-green-50 brush-cursor">
                                <!-- 远山 -->
                                <div class="absolute bottom-32 left-0 right-0 h-48 bg-gradient-to-t from-gray-700/30 to-transparent">
                                    <div class="absolute bottom-0 left-20 w-40 h-32 bg-gray-600/40 rounded-full"></div>
                                    <div class="absolute bottom-0 left-48 w-56 h-40 bg-gray-600/50 rounded-full"></div>
                                    <div class="absolute bottom-0 right-32 w-48 h-36 bg-gray-600/35 rounded-full"></div>
                                </div>
                                
                                <!-- 树木 -->
                                <div class="absolute bottom-20 left-40">
                                    <div class="w-1 h-16 bg-[#4a3728]"></div>
                                    <div class="absolute -top-8 -left-4 w-10 h-10 bg-[#4a7c59] rounded-full"></div>
                                </div>
                                
                                <div class="absolute bottom-24 right-56">
                                    <div class="w-1 h-12 bg-[#4a3728]"></div>
                                    <div class="absolute -top-6 -left-3 w-8 h-8 bg-[#6b8e6b] rounded-full"></div>
                                </div>
                                
                                <!-- 水面 -->
                                <div class="absolute bottom-0 left-0 right-0 h-20 bg-gradient-to-t from-blue-200/50 to-transparent"></div>
                                
                                <!-- 小船 -->
                                <div class="absolute bottom-12 left-1/2 transform -translate-x-1/2">
                                    <div class="w-12 h-3 bg-[#4a3728] rounded"></div>
                                    <div class="absolute -top-6 left-2 w-0.5 h-6 bg-[#4a3728]"></div>
                                    <div class="absolute -top-4 left-2 w-6 h-4 bg-white/80 rounded"></div>
                                </div>
                                
                                <!-- 书法题字 -->
                                <div class="absolute top-8 right-8">
                                    <div class="font-serif text-2xl text-gray-800 writing-vertical">
                                        <div class="writing-mode-vertical">山水清音</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    
                    <!-- 右侧面板 -->
                    <div class="w-64 border-l border-[#1a1a1a]/10 p-4">
                        <!-- 颜色面板 -->
                        <div class="mb-6">
                            <h4 class="text-sm font-medium mb-3">颜色</h4>
                            
                            <div class="grid grid-cols-5 gap-2">
                                <div class="color-swatch w-8 h-8 rounded-full bg-black cursor-pointer ring-2 ring-offset-2 ring-black"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-gray-600 cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-gray-400 cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-white border cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-red-700 cursor-pointer"></div>
                                
                                <div class="color-swatch w-8 h-8 rounded-full bg-yellow-700 cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-[#4a7c59] cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-blue-600 cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-purple-700 cursor-pointer"></div>
                                <div class="color-swatch w-8 h-8 rounded-full bg-amber-800 cursor-pointer"></div>
                            </div>
                        </div>
                        
                        <!-- 笔刷大小 -->
                        <div class="mb-6">
                            <h4 class="text-sm font-medium mb-3">笔刷大小</h4>
                            
                            <div class="flex items-center space-x-3">
                                <div class="w-2 h-2 rounded-full bg-black"></div>
                                <input type="range" min="1" max="100" value="25" class="flex-1">
                                <div class="w-6 h-6 rounded-full bg-black"></div>
                            </div>
                            
                            <div class="text-center text-sm text-[#4a5568] mt-2">25px</div>
                        </div>
                        
                        <!-- 不透明度 -->
                        <div class="mb-6">
                            <h4 class="text-sm font-medium mb-3">不透明度</h4>
                            
                            <input type="range" min="0" max="100" value="100" class="w-full">
                            
                            <div class="text-center text-sm text-[#4a5568] mt-2">100%</div>
                        </div>
                        
                        <!-- 图层面板 -->
                        <div>
                            <h4 class="text-sm font-medium mb-3">图层</h4>
                            
                            <div class="space-y-2">
                                <div class="layer-item flex items-center space-x-2 p-2 rounded bg-[#4a7c59]/10 border border-[#4a7c59]/30">
                                    <input type="checkbox" checked class="rounded">
                                    <div class="w-8 h-8 bg-gray-200 rounded"></div>
                                    <span class="text-sm flex-1">背景</span>
                                    <button class="text-[#4a5568]">🔒</button>
                                </div>
                                
                                <div class="layer-item flex items-center space-x-2 p-2 rounded hover:bg-[#1a1a1a]/5">
                                    <input type="checkbox" checked class="rounded">
                                    <div class="w-8 h-8 bg-gray-400 rounded"></div>
                                    <span class="text-sm flex-1">远山</span>
                                    <button class="text-[#4a5568]">👁</button>
                                </div>
                                
                                <div class="layer-item flex items-center space-x-2 p-2 rounded hover:bg-[#1a1a1a]/5">
                                    <input type="checkbox" checked class="rounded">
                                    <div class="w-8 h-8 bg-[#4a7c59] rounded"></div>
                                    <span class="text-sm flex-1">树木</span>
                                    <button class="text-[#4a5568]">👁</button>
                                </div>
                                
                                <div class="layer-item flex items-center space-x-2 p-2 rounded hover:bg-[#1a1a1a]/5">
                                    <input type="checkbox" class="rounded">
                                    <div class="w-8 h-8 bg-blue-400 rounded"></div>
                                    <span class="text-sm flex-1">水面</span>
                                    <button class="text-[#4a5568]">👁</button>
                                </div>
                                
                                <div class="layer-item flex items-center space-x-2 p-2 rounded hover:bg-[#1a1a1a]/5">
                                    <input type="checkbox" checked class="rounded">
                                    <div class="w-8 h-8 bg-amber-800 rounded"></div>
                                    <span class="text-sm flex-1">小船</span>
                                    <button class="text-[#4a5568]">👁</button>
                                </div>
                                
                                <div class="layer-item flex items-center space-x-2 p-2 rounded hover:bg-[#1a1a1a]/5">
                                    <input type="checkbox" checked class="rounded">
                                    <div class="w-8 h-8 border rounded flex items-center justify-center text-xs">文</div>
                                    <span class="text-sm flex-1">题字</span>
                                    <button class="text-[#4a5568]">👁</button>
                                </div>
                            </div>
                            
                            
                            <div class="mt-4 flex justify-center space-x-2">
                                <button class="px-3 py-1.5 text-sm bg-[#1a1a1a]/5 rounded hover:bg-[#1a1a1a]/10 transition">+ 新建</button>
                                <button class="px-3 py-1.5 text-sm bg-[#1a1a1a]/5 rounded hover:bg-[#1a1a1a]/10 transition">删除</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 书法作品展示 -->
        <section class="py-8 max-w-7xl mx-auto px-6">
            <h3 class="font-serif text-xl font-bold mb-6">精选画作</h3>
            
            <div class="grid grid-cols-3 gap-6">
                <!-- 画作卡片 1 -->
                <div class="artwork-card bg-white rounded-xl overflow-hidden shadow-sm border border-[#1a1a1a]/5">
                    <div class="aspect-[4/3] bg-gradient-to-br from-gray-100 to-gray-200 relative">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="text-center">
                                <div class="font-serif text-6xl text-gray-800 mb-4">山水</div>
                                <div class="w-16 h-16 border-2 border-red-800 mx-auto rounded flex items-center justify-center">
                                    <span class="text-red-800 font-serif">印章</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-4">
                        <h4 class="font-medium mb-1">《山居秋暝》</h4>
                        <p class="text-sm text-[#4a5568] mb-3">水墨山水 · 墨者</p>
                        
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-1 text-xs bg-[#4a7c59]/10 text-[#4a7c59] rounded">山水画</span>
                            <span class="text-sm text-[#4a5568]">☯ 0.82</span>
                        </div>
                    </div>
                </div>
                
                <!-- 画作卡片 2 -->
                <div class="artwork-card bg-white rounded-xl overflow-hidden shadow-sm border border-[#1a1a1a]/5">
                    <div class="aspect-[4/3] bg-gradient-to-br from-pink-50 to-red-50 relative">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="w-32 h-32 rounded-full bg-gradient-to-br from-red-400 to-pink-300"></div>
                        </div>
                    </div>
                    
                    <div class="p-4">
                        <h4 class="font-medium mb-1">《牡丹图》</h4>
                        <p class="text-sm text-[#4a5568] mb-3">工笔花鸟 · 花间客</p>
                        
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-1 text-xs bg-red-100 text-red-700 rounded">花鸟画</span>
                            <span class="text-sm text-[#4a5568]">☯ 0.75</span>
                        </div>
                    </div>
                </div>
                
                <!-- 画作卡片 3 -->
                <div class="artwork-card bg-white rounded-xl overflow-hidden shadow-sm border border-[#1a1a1a]/5">
                    <div class="aspect-[4/3] bg-gradient-to-br from-amber-50 to-yellow-50 relative">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="font-serif text-5xl text-amber-800">龙飞凤舞</div>
                        </div>
                    </div>
                    
                    <div class="p-4">
                        <h4 class="font-medium mb-1">《草书帖》</h4>
                        <p class="text-sm text-[#4a5568] mb-3">狂草 · 书狂</p>
                        
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-1 text-xs bg-amber-100 text-amber-800 rounded">书法</span>
                            <span class="text-sm text-[#4a5568]">☯ 0.88</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
