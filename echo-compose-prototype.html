<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Compose 2.0 - Liquid Metal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0F;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 背景粒子画布 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .logo h1 {
            font-size: clamp(48px, 10vw, 96px);
            font-weight: 200;
            letter-spacing: 0.3em;
            background: linear-gradient(135deg, #C0C0C0 0%, #FFFFFF 50%, #C0C0C0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: breathe 3s ease-in-out infinite;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00D4FF, transparent);
            animation: shimmer 2s linear infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes shimmer {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* 入口卡片区域 */
        .entrances {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            perspective: 1000px;
        }

        .entrance-card {
            width: 280px;
            height: 380px;
            background: linear-gradient(145deg, rgba(192, 192, 192, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .entrance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .entrance-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 
                0 20px 60px rgba(0, 212, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .entrance-card:hover::before {
            opacity: 1;
        }

        .entrance-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 30px;
            position: relative;
        }

        .entrance-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: url(#metal-gradient);
            stroke-width: 1.5;
        }

        .entrance-card h2 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #C0C0C0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .entrance-card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* 液态生成按钮 */
        .liquid-button {
            margin-top: 60px;
            position: relative;
            display: none;
        }

        .liquid-button.active {
            display: block;
        }

        .liquid-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #C0C0C0, #808080);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(192, 192, 192, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.3);
            animation: liquid-idle 3s ease-in-out infinite;
        }

        @keyframes liquid-idle {
            0%, 100% { 
                border-radius: 50%;
                transform: scale(1) rotate(0deg);
            }
            25% { 
                border-radius: 48% 52% 52% 48%;
                transform: scale(1.02) rotate(2deg);
            }
            50% { 
                border-radius: 52% 48% 48% 52%;
                transform: scale(1) rotate(0deg);
            }
            75% { 
                border-radius: 48% 52% 52% 48%;
                transform: scale(0.98) rotate(-2deg);
            }
        }

        .liquid-btn::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(10px);
        }

        .liquid-btn span {
            position: relative;
            z-index: 2;
            font-size: 16px;
            color: #0A0A0F;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        /* 声纹可视化 */
        .waveform {
            display: none;
            width: 100%;
            max-width: 800px;
            height: 200px;
            margin: 40px auto;
            position: relative;
        }

        .waveform.active {
            display: block;
        }

        .wave-bar {
            position: absolute;
            bottom: 50%;
            width: 4px;
            background: linear-gradient(to top, #00D4FF, transparent);
            border-radius: 2px;
            transform-origin: bottom;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        /* 星系市场预览 */
        .galaxy-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .galaxy-preview.active {
            display: block;
        }

        .galaxy-canvas {
            width: 100%;
            height: 100%;
        }

        /* 导航 */
        .nav-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 0.2em;
            z-index: 100;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            display: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .back-btn.visible {
            display: block;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .entrances {
                flex-direction: column;
                align-items: center;
            }
            
            .entrance-card {
                width: 90%;
                max-width: 320px;
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景粒子画布 -->
    <canvas id="particle-canvas"></canvas>

    <!-- 返回按钮 -->
    <button class="back-btn" onclick="goBack()">← 返回</button>

    <!-- 主容器 -->
    <div class="container" id="main-container">
        <!-- Logo -->
        <div class="logo">
            <h1>ECHO</h1>
        </div>

        <!-- 入口卡片 -->
        <div class="entrances">
            <div class="entrance-card" onclick="enterStudio('original')">
                <div class="entrance-icon">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="metal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#C0C0C0"/>
                                <stop offset="50%" style="stop-color:#FFFFFF"/>
                                <stop offset="100%" style="stop-color:#C0C0C0"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="40"/>
                        <path d="M35 50 L50 35 L50 65 Z" fill="url(#metal-gradient)"/>
                        <path d="M50 50 L65 35 L65 65 Z" fill="url(#metal-gradient)"/>
                    </svg>
                </div>
                <h2>原创</h2>
                <p>Create Original</p>
            </div>

            <div class="entrance-card" onclick="enterStudio('remix')">
                <div class="entrance-icon">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40"/>
                        <path d="M30 40 Q50 20 70 40 Q50 60 30 40" fill="url(#metal-gradient)"/>
                        <path d="M30 60 Q50 40 70 60 Q50 80 30 60" fill="url(#metal-gradient)"/>
                    </svg>
                </div>
                <h2>衍生</h2>
                <p>Remix & Derive</p>
            </div>
        </div>

        <!-- 液态生成按钮 -->
        <div class="liquid-button" id="liquid-btn">
            <button class="liquid-btn" onclick="generateAudio()">
                <span>GENERATE</span>
            </button>
        </div>

        <!-- 声纹可视化 -->
        <div class="waveform" id="waveform"></div>
    </div>

    <!-- 星系市场 -->
    <div class="galaxy-preview" id="galaxy-preview">
        <canvas class="galaxy-canvas" id="galaxy-canvas"></canvas>
    </div>

    <!-- 导航提示 -->
    <div class="nav-hint">点击卡片进入创作空间</div>

    <script>
        // 粒子背景系统
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouse = { x: null, y: null };
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            
            update() {
                // 鼠标交互
                if (mouse.x != null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        const force = (150 - distance) / 150;
                        this.x -= dx * force * 0.02;
                        this.y -= dy * force * 0.02;
                    }
                }
                
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.fillStyle = `rgba(0, 212, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }
        
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.strokeStyle = `rgba(0, 212, 255, ${0.1 * (1 - distance / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animateParticles);
        }
        
        // 鼠标追踪
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });
        
        window.addEventListener('resize', resize);
        
        resize();
        initParticles();
        animateParticles();
        
        // 页面切换逻辑
        let currentView = 'landing';
        
        function enterStudio(type) {
            currentView = 'studio';
            document.querySelector('.entrances').style.display = 'none';
            document.querySelector('.logo').style.display = 'none';
            document.querySelector('.liquid-button').classList.add('active');
            document.querySelector('.waveform').classList.add('active');
            document.querySelector('.back-btn').classList.add('visible');
            document.querySelector('.nav-hint').textContent = type === 'original' ? '原创创作空间' : '衍生创作空间';
            
            initWaveform();
        }
        
        function goBack() {
            if (currentView === 'studio') {
                currentView = 'landing';
                document.querySelector('.entrances').style.display = 'flex';
                document.querySelector('.logo').style.display = 'block';
                document.querySelector('.liquid-button').classList.remove('active');
                document.querySelector('.waveform').classList.remove('active');
                document.querySelector('.back-btn').classList.remove('visible');
                document.querySelector('.nav-hint').textContent = '点击卡片进入创作空间';
            } else if (currentView === 'galaxy') {
                currentView = 'landing';
                document.getElementById('galaxy-preview').classList.remove('active');
                document.getElementById('main-container').style.display = 'flex';
                document.querySelector('.back-btn').classList.remove('visible');
            }
        }
        
        // 声纹可视化
        function initWaveform() {
            const container = document.getElementById('waveform');
            container.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const bar = document.createElement('div');
                bar.className = 'wave-bar';
                bar.style.left = `${i * 2}%`;
                bar.style.height = `${Math.random() * 150 + 50}px`;
                bar.style.animationDelay = `${i * 0.05}s`;
                bar.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                container.appendChild(bar);
            }
        }
        
        // 生成音频动画
        function generateAudio() {
            const btn = document.querySelector('.liquid-btn');
            btn.style.animation = 'none';
            btn.offsetHeight; // 触发重绘
            btn.style.animation = 'liquid-generate 2s ease-in-out';
            
            // 模拟生成过程
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                btn.querySelector('span').textContent = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    btn.querySelector('span').textContent = 'DONE!';
                    setTimeout(() => {
                        btn.querySelector('span').textContent = 'GENERATE';
                        btn.style.animation = 'liquid-idle 3s ease-in-out infinite';
                        showGalaxy();
                    }, 1000);
                }
            }, 200);
        }
        
        // 星系市场
        function showGalaxy() {
            currentView = 'galaxy';
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('galaxy-preview').classList.add('active');
            document.querySelector('.nav-hint').textContent = '拖拽旋转星系 · 点击星球查看详情';
            
            initGalaxy();
        }
        
        function initGalaxy() {
            const gCanvas = document.getElementById('galaxy-canvas');
            const gCtx = gCanvas.getContext('2d');
            
            gCanvas.width = window.innerWidth;
            gCanvas.height = window.innerHeight;
            
            const stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * gCanvas.width,
                    y: Math.random() * gCanvas.height,
                    size: Math.random() * 2,
                    opacity: Math.random()
                });
            }
            
            const planets = [
                { x: 0.3, y: 0.3, size: 30, color: '#00D4FF', name: '古典·月光' },
                { x: 0.7, y: 0.4, size: 25, color: '#FF6B9D', name: '电子·脉冲' },
                { x: 0.5, y: 0.7, size: 35, color: '#00FF88', name: '流行·夏日' },
                { x: 0.2, y: 0.6, size: 20, color: '#FFB800', name: '爵士·午夜' },
                { x: 0.8, y: 0.8, size: 28, color: '#9D4EDD', name: '氛围·星空' }
            ];
            
            let rotation = 0;
            
            function animateGalaxy() {
                gCtx.fillStyle = '#0A0A0F';
                gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);
                
                // 背景星星
                stars.forEach(star => {
                    gCtx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    gCtx.beginPath();
                    gCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    gCtx.fill();
                });
                
                // 中心光晕
                const centerX = gCanvas.width / 2;
                const centerY = gCanvas.height / 2;
                
                const gradient = gCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 300);
                gradient.addColorStop(0, 'rgba(0, 212, 255, 0.3)');
                gradient.addColorStop(1, 'transparent');
                gCtx.fillStyle = gradient;
                gCtx.beginPath();
                gCtx.arc(centerX, centerY, 300, 0, Math.PI * 2);
                gCtx.fill();
                
                // 轨道
                gCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                gCtx.lineWidth = 1;
                [150, 250, 350].forEach(radius => {
                    gCtx.beginPath();
                    gCtx.ellipse(centerX, centerY, radius, radius * 0.6, rotation, 0, Math.PI * 2);
                    gCtx.stroke();
                });
                
                // 行星
                planets.forEach((planet, i) => {
                    const angle = rotation + (i * Math.PI * 2 / planets.length);
                    const orbitRadius = 200 + i * 50;
                    const x = centerX + Math.cos(angle) * orbitRadius;
                    const y = centerY + Math.sin(angle) * orbitRadius * 0.6;
                    
                    // 发光效果
                    const glow = gCtx.createRadialGradient(x, y, 0, x, y, planet.size * 2);
                    glow.addColorStop(0, planet.color + '40');
                    glow.addColorStop(1, 'transparent');
                    gCtx.fillStyle = glow;
                    gCtx.beginPath();
                    gCtx.arc(x, y, planet.size * 2, 0, Math.PI * 2);
                    gCtx.fill();
                    
                    // 行星本体
                    const planetGrad = gCtx.createRadialGradient(x - planet.size/3, y - planet.size/3, 0, x, y, planet.size);
                    planetGrad.addColorStop(0, '#fff');
                    planetGrad.addColorStop(0.3, planet.color);
                    planetGrad.addColorStop(1, planet.color + '80');
                    
                    gCtx.fillStyle = planetGrad;
                    gCtx.beginPath();
                    gCtx.arc(x, y, planet.size, 0, Math.PI * 2);
                    gCtx.fill();
                });
                
                rotation += 0.002;
                requestAnimationFrame(animateGalaxy);
            }
            
            animateGalaxy();
        }
        
        // 添加生成动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes liquid-generate {
                0% { transform: scale(1) rotate(0deg); border-radius: 50%; }
                25% { transform: scale(1.2) rotate(90deg); border-radius: 40% 60% 60% 40%; }
                50% { transform: scale(0.9) rotate(180deg); border-radius: 60% 40% 40% 60%; }
                75% { transform: scale(1.1) rotate(270deg); border-radius: 45% 55% 55% 45%; }
                100% { transform: scale(1) rotate(360deg); border-radius: 50%; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
