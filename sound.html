<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音 - 宇宙音乐探索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-deep: #050510;
            --bg-primary: #0A0A1A;
            --bg-secondary: #121228;
            --bg-glass: rgba(18, 18, 40, 0.6);
            --accent-cyan: #00F5FF;
            --accent-pink: #FF1493;
            --accent-purple: #8B5CF6;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 120px;
        }

        /* 星空背景 */
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: nebulaFloat 20s ease-in-out infinite;
        }
        .nebula-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-cyan), transparent);
            top: -200px; right: -100px;
        }
        .nebula-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-pink), transparent);
            bottom: -150px; left: -100px;
            animation-delay: -7s;
        }
        @keyframes nebulaFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 250px 120px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 500px 250px, rgba(255,255,255,0.2), transparent);
            background-size: 550px 350px;
            animation: twinkle 8s ease-in-out infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 16px 24px;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .nav-logo-icon {
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.5));
        }
        .nav-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-link {
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
            background: rgba(0, 245, 255, 0.1);
        }
        .nav-link.create-btn {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(255, 20, 147, 0.2));
            border: 1px solid rgba(0, 245, 255, 0.3);
        }
        .nav-link.create-btn:hover {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.3), rgba(255, 20, 147, 0.3));
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 24px 40px;
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: 8px;
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* 搜索筛选区域 */
        .filter-section {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 32px;
        }
        .filter-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-pink), transparent);
        }

        /* 搜索栏 */
        .search-container {
            position: relative;
            margin-bottom: 24px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
        }
        .search-icon {
            position: absolute;
            left: 20px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* 筛选器网格 */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .filter-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .filter-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        .filter-select:focus {
            border-color: var(--accent-cyan);
        }

        /* 排序按钮 */
        .sort-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sort-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .sort-btn:hover, .sort-btn.active {
            background: rgba(0, 245, 255, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* 活跃筛选标签 */
        .active-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.15), rgba(255, 20, 147, 0.15));
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 20px;
            font-size: 13px;
        }
        .filter-tag-remove {
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s ease;
        }
        .filter-tag-remove:hover {
            opacity: 1;
            color: var(--accent-pink);
        }

        /* 结果统计 */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .results-count {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .results-count span {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* 音乐卡片网格 */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .music-card {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .music-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 245, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 245, 255, 0.1);
        }

        .music-cover {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
        }
        .music-cover img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .music-card:hover .music-cover img {
            transform: scale(1.1);
        }
        .music-cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5, 5, 16, 0.9), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .music-card:hover .music-cover-overlay {
            opacity: 1;
        }

        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
        }
        .music-card:hover .play-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .asset-type-badge {
            position: absolute;
            top: 12px; left: 12px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .asset-type-badge.original {
            color: var(--accent-cyan);
            border-color: rgba(0, 245, 255, 0.3);
        }
        .asset-type-badge.derivative {
            color: var(--accent-pink);
            border-color: rgba(255, 20, 147, 0.3);
        }

        .music-info {
            padding: 20px;
        }
        .music-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-artist {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .music-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .music-genre {
            font-size: 12px;
            color: var(--text-muted);
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .music-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-cyan);
        }
        .music-price span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 迷你播放器 */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 0 0 280px;
        }
        .player-cover {
            width: 56px; height: 56px;
            border-radius: 8px;
            object-fit: cover;
            animation: rotate 20s linear infinite paused;
        }
        .player-cover.playing {
            animation-play-state: running;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .player-text {
            overflow: hidden;
        }
        .player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-artist {
            font-size: 12px;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 0 0 auto;
        }
        .control-btn {
            width: 40px; height: 40px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            color: var(--accent-cyan);
        }
        .control-btn.play {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            border-radius: 50%;
            color: white;
        }

        .player-progress {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .time {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
        }

        .player-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 40px;
            padding: 0 20px;
        }
        .viz-bar {
            width: 4px;
            background: linear-gradient(to top, var(--accent-cyan), var(--accent-pink));
            border-radius: 2px;
            animation: vizDance 0.5s ease-in-out infinite alternate;
        }
        @keyframes vizDance {
            from { height: 10%; }
            to { height: 80%; }
        }

        /* 创作面板 */
        .create-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1001;
            display: none;
            overflow-y: auto;
        }
        .create-panel.active {
            display: block;
        }
        .create-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 24px 40px;
        }
        .create-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }
        .create-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .close-btn {
            width: 48px; height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .close-btn:hover {
            background: rgba(255, 20, 147, 0.2);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        .upload-zone {
            border: 2px dashed rgba(0, 245, 255, 0.3);
            border-radius: 24px;
            padding: 60px;
            text-align: center;
            margin-bottom: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-zone:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 245, 255, 0.05);
        }
        .upload-icon {
            font-size: 48px;
            color: var(--accent-cyan);
            margin-bottom: 16px;
        }
        .upload-text {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .upload-hint {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 24px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: var(--accent-cyan);
        }
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .asset-type-selector {
            display: flex;
            gap: 16px;
        }
        .type-option {
            flex: 1;
            padding: 20px;
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .type-option:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }
        .type-option.selected.original {
            border-color: var(--accent-cyan);
            background: rgba(0, 245, 255, 0.1);
        }
        .type-option.selected.derivative {
            border-color: var(--accent-pink);
            background: rgba(255, 20, 147, 0.1);
        }
        .type-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .type-option.original .type-icon {
            color: var(--accent-cyan);
        }
        .type-option.derivative .type-icon {
            color: var(--accent-pink);
        }

        .rights-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .right-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        .right-checkbox {
            width: 20px; height: 20px;
            accent-color: var(--accent-cyan);
        }
        .right-label {
            flex: 1;
            font-size: 14px;
        }
        .right-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .price-inputs {
            display: flex;
            gap: 16px;
        }
        .price-field {
            flex: 1;
        }
        .price-input-wrapper {
            position: relative;
        }
        .price-input-wrapper span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .price-input-wrapper .form-input {
            padding-left: 32px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .page-title { font-size: 32px; letter-spacing: 4px; }
            .music-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .player-visualizer { display: none; }
            .player-info { flex: 1; }
            .nav-links { display: none; }
            .rights-grid { grid-template-columns: 1fr; }
            .price-inputs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="cosmic-bg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="stars"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-brand">
                <span class="nav-logo-icon">♪</span>
                <span class="nav-logo-text">音</span>
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link active">发现</a>
                <a href="#" class="nav-link">我的作品</a>
                <a href="#" class="nav-link create-btn" onclick="openCreatePanel()">
                    <i class="fas fa-plus"></i> 创作
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="container">
        <!-- 页面标题 -->
        <header class="page-header">
            <h1 class="page-title">音</h1>
            <p class="page-subtitle">探索宇宙中的音乐资产</p>
        </header>

        <!-- 搜索筛选 -->
        <section class="filter-section">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索音乐、艺术家、流派...">
            </div>

            <div class="filter-grid">
                <div>
                    <label class="filter-label">资产类型</label>
                    <select class="filter-select" id="typeFilter">
                        <option value="">全部类型</option>
                        <option value="original">原创作品</option>
                        <option value="derivative">衍生作品</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">流派</label>
                    <select class="filter-select" id="genreFilter">
                        <option value="">全部流派</option>
                        <option value="electronic">电子</option>
                        <option value="ambient">氛围</option>
                        <option value="classical">古典</option>
                        <option value="pop">流行</option>
                        <option value="jazz">爵士</option>
                        <option value="rock">摇滚</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">排序</label>
                    <div class="sort-options">
                        <button class="sort-btn active" data-sort="latest">最新</button>
                        <button class="sort-btn" data-sort="popular">最热</button>
                        <button class="sort-btn" data-sort="price">价格</button>
                    </div>
                </div>
            </div>

            <div class="active-filters" id="activeFilters">
                <span style="color: var(--text-muted); font-size: 13px;">点击卡片播放音乐</span>
            </div>
        </section>

        <!-- 结果区域 -->
        <section class="results-section">
            <div class="results-header">
                <div class="results-count">发现 <span id="resultCount">12</span> 个音乐资产</div>
            </div>
            <div class="music-grid" id="musicGrid"></div>
        </section>
    </main>

    <!-- 迷你播放器 -->
    <div class="mini-player" id="miniPlayer">
        <div class="player-info">
            <img src="" alt="Cover" class="player-cover" id="playerCover">
            <div class="player-text">
                <div class="player-title" id="playerTitle">选择一首音乐</div>
                <div class="player-artist" id="playerArtist">开始你的宇宙之旅</div>
            </div>
        </div>
        <div class="player-controls">
            <button class="control-btn" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
            <button class="control-btn play" onclick="togglePlay()" id="playBtn">
                <i class="fas fa-play"></i>
            </button>
            <button class="control-btn" onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
        </div>
        <div class="player-progress">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-bar" onclick="seek(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time" id="totalTime">0:00</span>
        </div>
        <div class="player-visualizer" id="visualizer"></div>
    </div>

    <!-- 创作面板 -->
    <div class="create-panel" id="createPanel">
        <div class="create-container">
            <div class="create-header">
                <h2 class="create-title">创作新作品</h2>
                <button class="close-btn" onclick="closeCreatePanel()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="upload-text">拖拽音乐文件到此处</div>
                <div class="upload-hint">支持 MP3, WAV, FLAC 格式</div>
                <input type="file" id="fileInput" accept="audio/*" style="display: none;">
            </div>

            <div class="form-group">
                <label class="form-label">作品名称</label>
                <input type="text" class="form-input" placeholder="给你的作品起个名字">
            </div>

            <div class="form-group">
                <label class="form-label">艺术家</label>
                <input type="text" class="form-input" placeholder="艺术家名称">
            </div>

            <div class="form-group">
                <label class="form-label">流派</label>
                <select class="form-select">
                    <option>电子</option>
                    <option>氛围</option>
                    <option>古典</option>
                    <option>流行</option>
                    <option>爵士</option>
                    <option>摇滚</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">描述</label>
                <textarea class="form-textarea" placeholder="描述你的作品..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">资产类型</label>
                <div class="asset-type-selector">
                    <div class="type-option original selected" onclick="selectType(this, 'original')">
                        <div class="type-icon"><i class="fas fa-star"></i></div>
                        <div>原创作品</div>
                    </div>
                    <div class="type-option derivative" onclick="selectType(this, 'derivative')">
                        <div class="type-icon"><i class="fas fa-code-branch"></i></div>
                        <div>衍生作品</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">价格设置 (ETH)</label>
                <div class="price-inputs">
                    <div class="price-field">
                        <div class="price-input-wrapper">
                            <span>Ξ</span>
                            <input type="number" class="form-input" placeholder="播放价格" step="0.001" min="0">
                        </div>
                    </div>
                    <div class="price-field">
                        <div class="price-input-wrapper">
                            <span>Ξ</span>
                            <input type="number" class="form-input" placeholder="下载价格" step="0.001" min="0">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">权利配置</label>
                <div class="rights-grid">
                    <div class="right-item">
                        <input type="checkbox" class="right-checkbox" checked>
                        <div>
                            <div class="right-label">允许免费试听</div>
                            <div class="right-desc">用户可以免费播放</div>
                        </div>
                    </div>
                    <div class="right-item">
                        <input type="checkbox" class="right-checkbox" checked>
                        <div>
                            <div class="right-label">允许下载</div>
                            <div class="right-desc">用户可以下载音频</div>
                        </div>
                    </div>
                    <div class="right-item">
                        <input type="checkbox" class="right-checkbox">
                        <div>
                            <div class="right-label">允许衍生创作</div>
                            <div class="right-desc">他人可基于此创作</div>
                        </div>
                    </div>
                    <div class="right-item">
                        <input type="checkbox" class="right-checkbox">
                        <div>
                            <div class="right-label">商业使用授权</div>
                            <div class="right-desc">允许商业项目使用</div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="submit-btn" onclick="submitCreation()">
                <i class="fas fa-rocket"></i> 发布作品
            </button>
        </div>
    </div>

    <script>
        // 示例音乐数据
        const musicData = [
            { id: 1, title: "星际漫游者", artist: "Cosmic Voyager", genre: "电子", price: "0.5", type: "original", cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400&h=400&fit=crop", duration: "3:45" },
            { id: 2, title: "星云交响诗", artist: "Stellar Symphony", genre: "古典", price: "1.2", type: "derivative", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&h=400&fit=crop", duration: "5:20" },
            { id: 3, title: "深空回响", artist: "Deep Space Echo", genre: "氛围", price: "0.8", type: "original", cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=400&fit=crop", duration: "4:15" },
            { id: 4, title: "银河节拍", artist: "Galaxy Beats", genre: "电子", price: "0.3", type: "original", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop", duration: "3:30" },
            { id: 5, title: "量子梦境", artist: "Quantum Dreams", genre: "流行", price: "0.95", type: "derivative", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop", duration: "3:55" },
            { id: 6, title: "虚空旋律", artist: "Void Melodies", genre: "爵士", price: "2.0", type: "original", cover: "https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=400&h=400&fit=crop", duration: "4:45" },
            { id: 7, title: "脉冲星节奏", artist: "Pulsar Rhythm", genre: "电子", price: "0.75", type: "original", cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=400&h=400&fit=crop", duration: "3:20" },
            { id: 8, title: "黑洞频率", artist: "Black Hole Freq", genre: "摇滚", price: "1.5", type: "derivative", cover: "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?w=400&h=400&fit=crop", duration: "4:00" },
            { id: 9, title: "星际穿越", artist: "Interstellar", genre: "氛围", price: "0.6", type: "original", cover: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=400&h=400&fit=crop", duration: "6:10" },
            { id: 10, title: "宇宙弦乐", artist: "Cosmic Strings", genre: "古典", price: "1.8", type: "original", cover: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=400&fit=crop", duration: "5:30" },
            { id: 11, title: "火星律动", artist: "Mars Groove", genre: "流行", price: "0.45", type: "derivative", cover: "https://images.unsplash.com/photo-1614726365723-49cfae988d8d?w=400&h=400&fit=crop", duration: "3:15" },
            { id: 12, title: "银河漫步", artist: "Galaxy Walk", genre: "爵士", price: "1.1", type: "derivative", cover: "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=400&h=400&fit=crop", duration: "4:20" }
        ];

        let currentSong = null;
        let isPlaying = false;
        let currentIndex = 0;
        let audio = new Audio();

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderMusicGrid(musicData);
            initVisualizer();
            initSortButtons();
            initFilters();
        });

        // 渲染音乐网格
        function renderMusicGrid(data) {
            const grid = document.getElementById('musicGrid');
            grid.innerHTML = data.map(song => `
                <div class="music-card" onclick="playSong(${song.id})">
                    <div class="music-cover">
                        <img src="${song.cover}" alt="${song.title}">
                        <div class="music-cover-overlay"></div>
                        <span class="asset-type-badge ${song.type}">${song.type === 'original' ? '原创' : '衍生'}</span>
                        <button class="play-btn">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                    <div class="music-info">
                        <h3 class="music-title">${song.title}</h3>
                        <p class="music-artist">${song.artist}</p>
                        <div class="music-meta">
                            <span class="music-genre">${song.genre}</span>
                            <div class="music-price"><span>Ξ</span> ${song.price}</div>
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('resultCount').textContent = data.length;
        }

        // 播放歌曲
        function playSong(id) {
            const song = musicData.find(s => s.id === id);
            if (!song) return;
            
            currentSong = song;
            currentIndex = musicData.findIndex(s => s.id === id);
            
            document.getElementById('playerTitle').textContent = song.title;
            document.getElementById('playerArtist').textContent = song.artist;
            document.getElementById('playerCover').src = song.cover;
            document.getElementById('totalTime').textContent = song.duration;
            
            isPlaying = true;
            updatePlayButton();
            document.getElementById('playerCover').classList.add('playing');
            
            // 模拟播放进度
            simulateProgress();
        }

        // 播放控制
        function togglePlay() {
            if (!currentSong) {
                playSong(musicData[0].id);
                return;
            }
            isPlaying = !isPlaying;
            updatePlayButton();
            document.getElementById('playerCover').classList.toggle('playing', isPlaying);
        }

        function updatePlayButton() {
            const btn = document.getElementById('playBtn');
            btn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
        }

        function prevSong() {
            if (currentIndex > 0) {
                playSong(musicData[currentIndex - 1].id);
            }
        }

        function nextSong() {
            if (currentIndex < musicData.length - 1) {
                playSong(musicData[currentIndex + 1].id);
            }
        }

        // 模拟播放进度
        function simulateProgress() {
            let progress = 0;
            const interval = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(interval);
                    return;
                }
                progress += 0.5;
                if (progress > 100) {
                    progress = 0;
                    nextSong();
                }
                document.getElementById('progressFill').style.width = progress + '%';
            }, 100);
        }

        function seek(event) {
            const bar = event.currentTarget;
            const percent = event.offsetX / bar.offsetWidth;
            document.getElementById('progressFill').style.width = (percent * 100) + '%';
        }

        // 可视化
        function initVisualizer() {
            const viz = document.getElementById('visualizer');
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'viz-bar';
                bar.style.height = Math.random() * 60 + 20 + '%';
                bar.style.animationDelay = (i * 0.05) + 's';
                bar.style.animationDuration = (0.3 + Math.random() * 0.4) + 's';
                viz.appendChild(bar);
            }
        }

        // 排序按钮
        function initSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        // 筛选
        function initFilters() {
            const searchInput = document.getElementById('searchInput');
            const typeFilter = document.getElementById('typeFilter');
            const genreFilter = document.getElementById('genreFilter');

            function filter() {
                const search = searchInput.value.toLowerCase();
                const type = typeFilter.value;
                const genre = genreFilter.value;

                const filtered = musicData.filter(song => {
                    const matchSearch = song.title.toLowerCase().includes(search) || 
                                      song.artist.toLowerCase().includes(search);
                    const matchType = !type || song.type === type;
                    const matchGenre = !genre || song.genre === genre;
                    return matchSearch && matchType && matchGenre;
                });

                renderMusicGrid(filtered);
            }

            searchInput.addEventListener('input', filter);
            typeFilter.addEventListener('change', filter);
            genreFilter.addEventListener('change', filter);
        }

        // 创作面板
        function openCreatePanel() {
            document.getElementById('createPanel').classList.add('active');
        }

        function closeCreatePanel() {
            document.getElementById('createPanel').classList.remove('active');
        }

        function selectType(el, type) {
            document.querySelectorAll('.type-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }

        function submitCreation() {
            alert('作品发布成功！');
            closeCreatePanel();
        }

        // 文件上传
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                document.querySelector('.upload-text').textContent = file.name;
            }
        });
    </script>
</body>
</html>
