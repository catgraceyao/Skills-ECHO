<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音 - 宇宙音乐探索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-deep: #0a0a0f;
            --bg-primary: #111118;
            --bg-secondary: #1a1a24;
            --bg-glass: rgba(26, 26, 36, 0.75);
            --accent-cyan: #4ecdc4;
            --accent-pink: #ff6b9d;
            --accent-gold: #d4a574;
            --accent-purple: #a78bfa;
            --text-primary: #f5f5f0;
            --text-secondary: rgba(245, 245, 240, 0.65);
            --text-muted: rgba(245, 245, 240, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(78, 205, 196, 0.1);
        }

        body {
            font-family: 'Inter', 'Noto Serif SC', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* 星空背景 */
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            animation: nebulaFloat 25s ease-in-out infinite;
        }
        .nebula-1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle, var(--accent-cyan), transparent);
            top: -250px; right: -150px;
        }
        .nebula-2 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-pink), transparent);
            bottom: -200px; left: -150px;
            animation-delay: -10s;
        }
        @keyframes nebulaFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.05); }
            66% { transform: translate(-30px, 20px) scale(0.95); }
        }
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(1.5px 1.5px at 30px 50px, rgba(255,255,255,0.25), transparent),
                radial-gradient(1px 1px at 80px 120px, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 250px 180px, rgba(255,255,255,0.15), transparent),
                radial-gradient(1px 1px at 400px 80px, rgba(255,255,255,0.2), transparent),
                radial-gradient(1.5px 1.5px at 550px 300px, rgba(255,255,255,0.15), transparent);
            background-size: 600px 400px;
            animation: twinkle 10s ease-in-out infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 28px;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .nav-logo-icon {
            font-size: 26px;
            color: var(--accent-cyan);
            opacity: 0.9;
        }
        .nav-logo-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 6px;
        }
        .nav-links {
            display: flex;
            gap: 6px;
        }
        .nav-link {
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
            background: rgba(78, 205, 196, 0.08);
        }
        .nav-link.create-btn {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.15), rgba(255, 107, 157, 0.1));
            border: 1px solid rgba(78, 205, 196, 0.25);
            color: var(--accent-cyan);
        }
        .nav-link.create-btn:hover {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.25), rgba(255, 107, 157, 0.15));
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.15);
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 28px 40px;
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 56px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: 16px;
            text-indent: 16px;
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        /* 搜索筛选区域 */
        .filter-section {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-soft);
        }

        /* 搜索栏 */
        .search-container {
            position: relative;
            margin-bottom: 24px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        .search-input:focus {
            border-color: rgba(78, 205, 196, 0.4);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.08);
        }
        .search-icon {
            position: absolute;
            left: 20px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* 筛选器网格 */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .filter-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .filter-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        .filter-select:focus {
            border-color: rgba(78, 205, 196, 0.4);
        }

        /* 排序按钮 */
        .sort-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sort-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .sort-btn:hover, .sort-btn.active {
            background: rgba(78, 205, 196, 0.12);
            border-color: rgba(78, 205, 196, 0.3);
            color: var(--accent-cyan);
        }

        /* 结果统计 */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .results-count {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .results-count span {
            color: var(--accent-cyan);
            font-weight: 500;
        }

        /* 音乐卡片网格 */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .music-card {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .music-card:hover {
            transform: translateY(-6px);
            border-color: rgba(78, 205, 196, 0.2);
            box-shadow: var(--shadow-glow), var(--shadow-soft);
        }

        .music-cover {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
        }
        .music-cover img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .music-card:hover .music-cover img {
            transform: scale(1.08);
        }
        .music-cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 10, 15, 0.85), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .music-card:hover .music-cover-overlay {
            opacity: 1;
        }

        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .play-btn i {
            color: var(--bg-deep);
            font-size: 20px;
            margin-left: 3px;
        }
        .music-card:hover .play-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.08);
            background: white;
        }

        /* 播放权限标识 */
        .play-badge {
            position: absolute;
            top: 12px; left: 12px;
            padding: 6px 12px;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .play-badge.free {
            color: var(--accent-cyan);
            border-color: rgba(78, 205, 196, 0.3);
        }
        .play-badge.paid {
            color: var(--accent-gold);
            border-color: rgba(212, 165, 116, 0.3);
        }
        .play-badge.owned {
            color: var(--accent-purple);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .asset-type-badge {
            position: absolute;
            top: 12px; right: 12px;
            padding: 5px 10px;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .asset-type-badge.original {
            color: var(--accent-cyan);
        }
        .asset-type-badge.derivative {
            color: var(--accent-pink);
        }

        .music-info {
            padding: 18px;
        }
        .music-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .music-artist {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .music-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .music-genre {
            font-size: 12px;
            color: var(--text-muted);
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
        }
        .music-price {
            font-size: 14px;
            font-weight: 500;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .music-price span {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 迷你播放器 - 与编辑器协调 */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(32px);
            border-top: 1px solid var(--border-subtle);
            padding: 14px 28px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4);
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 0 0 260px;
        }
        .player-cover {
            width: 52px; height: 52px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            animation: rotate 20s linear infinite paused;
            border: 1px solid var(--border-subtle);
        }
        .player-cover.playing {
            animation-play-state: running;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .player-text {
            overflow: hidden;
        }
        .player-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        .player-artist {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .player-rights {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .player-rights.free {
            background: rgba(78, 205, 196, 0.12);
            color: var(--accent-cyan);
        }
        .player-rights.paid {
            background: rgba(212, 165, 116, 0.12);
            color: var(--accent-gold);
        }
        .player-rights.owned {
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent-purple);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
        }
        .control-btn {
            width: 36px; height: 36px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .control-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }
        .control-btn.play {
            width: 44px; height: 44px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--bg-deep);
        }
        .control-btn.play:hover {
            background: white;
            transform: scale(1.05);
        }

        .player-progress {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
        }
        .progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'Inter', monospace;
            min-width: 36px;
        }

        .player-extra {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }
        .player-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 32px;
        }
        .viz-bar {
            width: 3px;
            background: linear-gradient(to top, var(--accent-cyan), var(--accent-pink));
            border-radius: 2px;
            animation: vizDance 0.5s ease-in-out infinite alternate;
            opacity: 0.7;
        }
        @keyframes vizDance {
            from { height: 15%; }
            to { height: 70%; }
        }

        /* 创作面板 - 与播放器协调 */
        .create-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.96);
            backdrop-filter: blur(40px);
            z-index: 1001;
            display: none;
            overflow-y: auto;
        }
        .create-panel.active {
            display: block;
        }
        .create-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 100px 28px 60px;
        }
        .create-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .create-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 4px;
        }
        .close-btn {
            width: 44px; height: 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: rgba(255, 107, 157, 0.1);
            border-color: rgba(255, 107, 157, 0.3);
            color: var(--accent-pink);
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed rgba(78, 205, 196, 0.25);
            border-radius: var(--radius-lg);
            padding: 48px;
            text-align: center;
            margin-bottom: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(78, 205, 196, 0.02);
        }
        .upload-zone:hover {
            border-color: rgba(78, 205, 196, 0.5);
            background: rgba(78, 205, 196, 0.05);
        }
        .upload-zone.has-file {
            border-color: var(--accent-cyan);
            background: rgba(78, 205, 196, 0.08);
        }
        .upload-icon {
            font-size: 40px;
            color: var(--accent-cyan);
            margin-bottom: 14px;
            opacity: 0.9;
        }
        .upload-text {
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .upload-hint {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 表单样式 - 与播放器统一 */
        .form-group {
            margin-bottom: 28px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: rgba(78, 205, 196, 0.4);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.06);
        }
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* 资产类型选择 */
        .asset-type-selector {
            display: flex;
            gap: 12px;
        }
        .type-option {
            flex: 1;
            padding: 20px;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .type-option:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .type-option.selected.original {
            border-color: var(--accent-cyan);
            background: rgba(78, 205, 196, 0.08);
        }
        .type-option.selected.derivative {
            border-color: var(--accent-pink);
            background: rgba(255, 107, 157, 0.08);
        }
        .type-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .type-option.original .type-icon {
            color: var(--accent-cyan);
        }
        .type-option.derivative .type-icon {
            color: var(--accent-pink);
        }
        .type-option .type-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .type-option.selected .type-label {
            color: var(--text-primary);
        }

        /* 价格设置 - 权属逻辑 */
        .price-section {
            background: rgba(10, 10, 15, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 28px;
        }
        .price-section-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;

                return `
                <div class="music-card" onclick="handlePlayAttempt(${song.id})">
                    <div class="music-cover">
                        <img src="${song.cover}" alt="${song.title}">
                        <div class="music-cover-overlay"></div>
                        
                        <!-- 播放权限标识 -->
                        <span class="play-badge ${canPlayFree ? (isOwned ? 'owned' : 'free') : 'paid'}">
                            <i class="fas ${canPlayFree ? (isOwned ? 'fa-check' : 'fa-play') : 'fa-lock'}"></i>
                            ${canPlayFree ? (isOwned ? '已拥有' : '免费') : `◈ ${song.playPrice}`}
                        </span>
                        
                        <span class="asset-type-badge ${song.type}">${song.type === 'original' ? '原创' : '衍生'}</span>
                        
                        <button class="play-btn">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                    <div class="music-info">
                        <h3 class="music-title">${song.title}</h3>
                        <p class="music-artist">${song.artist}</p>
                        <div class="music-meta">
                            <span class="music-genre">${song.genreLabel}</span>
                            <div class="music-price">
                                <span>下载</span> ◈ ${song.downloadPrice}
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
            document.getElementById('resultCount').textContent = data.length;
        }

        // 处理播放尝试 - 检查权属
        function handlePlayAttempt(id) {
            const song = musicData.find(s => s.id === id);
            if (!song) return;
            
            const isOwned = ownedTracks.has(song.id);
            const canPlayFree = song.playFree || isOwned;
            
            if (canPlayFree) {
                // 免费或已拥有，直接播放
                playSong(id);
            } else {
                // 需要付费，显示支付弹窗
                showPaymentModal(song);
            }
        }

        // 显示支付弹窗
        function showPaymentModal(song) {
            pendingSong = song;
            document.getElementById('paymentCover').src = song.cover;
            document.getElementById('paymentTrackTitle').textContent = song.title;
            document.getElementById('paymentTrackArtist').textContent = song.artist;
            document.getElementById('paymentAmount').textContent = `◈ ${song.playPrice}`;
            document.getElementById('paymentModal').classList.add('active');
        }

        // 关闭支付弹窗
        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('active');
            pendingSong = null;
        }

        // 确认支付
        function confirmPayment() {
            if (pendingSong) {
                // 模拟支付成功
                ownedTracks.add(pendingSong.id);
                
                // 重新渲染网格以更新标识
                renderMusicGrid(musicData);
                
                // 播放歌曲
                playSong(pendingSong.id);
                
                // 关闭弹窗
                closePaymentModal();
            }
        }

        // 播放歌曲
        function playSong(id) {
            const song = musicData.find(s => s.id === id);
            if (!song) return;
            
            currentSong = song;
            currentIndex = musicData.findIndex(s => s.id === id);
            
            document.getElementById('playerTitle').textContent = song.title;
            document.getElementById('playerArtist').textContent = song.artist;
            
            // 显示封面
            const coverEl = document.getElementById('playerCover');
            const placeholderEl = document.getElementById('playerCoverPlaceholder');
            coverEl.src = song.cover;
            coverEl.style.display = 'block';
            placeholderEl.style.display = 'none';
            
            document.getElementById('totalTime').textContent = song.duration;
            
            // 显示权属状态
            const rightsEl = document.getElementById('playerRights');
            const rightsTextEl = document.getElementById('playerRightsText');
            const isOwned = ownedTracks.has(song.id);
            
            rightsEl.style.display = 'inline-flex';
            rightsEl.className = 'player-rights ' + (song.playFree ? 'free' : (isOwned ? 'owned' : 'paid'));
            rightsTextEl.textContent = song.playFree ? '免费播放' : (isOwned ? '已购买' : `播放 ◈ ${song.playPrice}`);
            
            isPlaying = true;
            updatePlayButton();
            coverEl.classList.add('playing');
            
            // 模拟播放进度
            simulateProgress();
        }

        // 播放控制
        function togglePlay() {
            if (!currentSong) {
                playSong(musicData[0].id);
                return;
            }
            isPlaying = !isPlaying;
            updatePlayButton();
            const coverEl = document.getElementById('playerCover');
            coverEl.classList.toggle('playing', isPlaying);
        }

        function updatePlayButton() {
            const btn = document.getElementById('playBtn');
            btn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play" style="margin-left: 2px;"></i>';
        }

        function prevSong() {
            if (currentIndex > 0) {
                handlePlayAttempt(musicData[currentIndex - 1].id);
            }
        }

        function nextSong() {
            if (currentIndex < musicData.length - 1) {
                handlePlayAttempt(musicData[currentIndex + 1].id);
            }
        }

        // 模拟播放进度
        let progressInterval = null;
        function simulateProgress() {
            if (progressInterval) clearInterval(progressInterval);
            let progress = 0;
            progressInterval = setInterval(() => {
                if (!isPlaying) return;
                progress += 0.3;
                if (progress > 100) {
                    progress = 0;
                    nextSong();
                }
                document.getElementById('progressFill').style.width = progress + '%';
            }, 100);
        }

        function seek(event) {
            const bar = event.currentTarget;
            const percent = event.offsetX / bar.offsetWidth;
            document.getElementById('progressFill').style.width = (percent * 100) + '%';
        }

        // 可视化
        function initVisualizer() {
            const viz = document.getElementById('visualizer');
            for (let i = 0; i < 16; i++) {
                const bar = document.createElement('div');
                bar.className = 'viz-bar';
                bar.style.height = Math.random() * 50 + 15 + '%';
                bar.style.animationDelay = (i * 0.04) + 's';
                bar.style.animationDuration = (0.4 + Math.random() * 0.3) + 's';
                viz.appendChild(bar);
            }
        }

        // 排序按钮
        function initSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        // 筛选
        function initFilters() {
            const searchInput = document.getElementById('searchInput');
            const typeFilter = document.getElementById('typeFilter');
            const genreFilter = document.getElementById('genreFilter');

            function filter() {
                const search = searchInput.value.toLowerCase();
                const type = typeFilter.value;
                const genre = genreFilter.value;

                const filtered = musicData.filter(song => {
                    const matchSearch = song.title.toLowerCase().includes(search) || 
                                      song.artist.toLowerCase().includes(search);
                    const matchType = !type || song.type === type;
                    const matchGenre = !genre || song.genre === genre;
                    return matchSearch && matchType && matchGenre;
                });

                renderMusicGrid(filtered);
            }

            searchInput.addEventListener('input', filter);
            typeFilter.addEventListener('change', filter);
            genreFilter.addEventListener('change', filter);
        }

        // 创作面板
        function openCreatePanel() {
            document.getElementById('createPanel').classList.add('active');
        }

        function closeCreatePanel() {
            document.getElementById('createPanel').classList.remove('active');
        }

        function selectType(el, type) {
            document.querySelectorAll('.type-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            el.classList.add('selected');
        }

        // 权利项点击
        function toggleRight(el) {
            const checkbox = el.querySelector('.right-checkbox');
            checkbox.checked = !checkbox.checked;
            updateRightStyle(checkbox);
        }

        function updateRightStyle(checkbox) {
            const item = checkbox.closest('.right-item');
            if (checkbox.checked) {
                item.classList.add('checked');
            } else {
                item.classList.remove('checked');
            }
            
            // 如果勾选免费试听，清空播放价格
            if (checkbox.id === 'rightFreePlay' && checkbox.checked) {
                document.getElementById('playPrice').value = '';
            }
        }

        // 文件上传
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const zone = document.getElementById('uploadZone');
            const text = document.getElementById('uploadText');
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                text.textContent = file.name;
                zone.classList.add('has-file');
            } else {
                text.textContent = '拖拽音乐文件到此处';
                zone.classList.remove('has-file');
            }
        });

        // 提交创作
        function submitCreation() {
            const title = document.getElementById('createTitle').value;
            const artist = document.getElementById('createArtist').value;
            
            if (!title || !artist) {
                alert('请填写作品名称和艺术家');
                return;
            }
            
            alert('作品发布成功！');
            closeCreatePanel();
            
            // 清空表单
            document.getElementById('createTitle').value = '';
            document.getElementById('createArtist').value = '';
            document.getElementById('createDesc').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadText').textContent = '拖拽音乐文件到此处';
            document.getElementById('uploadZone').classList.remove('has-file');
        }
    </script>
</body>
</html>
